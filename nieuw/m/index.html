<title>LeukeKeuze – de kamer-tour</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<!-- VOORBEELD M (15-11-2026, Marius: 'kun je er nog 3 verzinnen'): de kamer-tour.
     Kies een kamer, tik in de getekende kamer op de bank, het bureau of het vogelhuisje en zie de cadeaus die daar horen.
     Kiezen op 'waar komt het te staan'. Alles uit de handgekozen toppen; geen sieraden, drank alleen bij het wijnrek. -->
<style>
:root{--bg:#FBF6EE;--inkt:#2A2420;--zacht:#7A6F66;--terra:#D9643A;--lijn:#EADFCF;--wit:#fff;--f:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--k:'Playfair Display',Georgia,serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--inkt);font:500 16px/1.5 var(--f)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left)) 60px}
h1{font:900 clamp(28px,8vw,44px)/1.05 var(--k);margin:6px 0 4px;letter-spacing:-.5px}
.sub{color:var(--zacht);margin:0 0 12px}
.kamers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media (min-width:640px){.kamers{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kamers button{min-height:48px;border-radius:14px;border:1.5px solid var(--lijn);background:var(--wit);font:800 14px/1.1 var(--f);padding:6px 4px}
.kamers button[aria-pressed="true"]{background:var(--inkt);border-color:var(--inkt);color:#fff}
.scene{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(60,40,20,.14);aspect-ratio:4/3;background:#eee}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:44px;min-height:44px;justify-content:center}
.hot .s{position:relative;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--terra);box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center;font:900 15px/1 var(--f);color:var(--terra)}
.hot .s::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid #fff;animation:puls 1.8s ease-out infinite}
@keyframes puls{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.hot .l{background:rgba(42,36,32,.82);color:#fff;font:800 11.5px/1 var(--f);padding:4px 7px;border-radius:999px;white-space:nowrap}
.hot[aria-expanded="true"] .s{background:var(--terra);color:#fff}
.tip{margin:12px 2px 0;color:var(--zacht);font-size:14px;text-align:center}
.blad{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--wit);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:76vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);max-width:820px;margin:0 auto}
.blad.open{transform:none}
.blad .kop{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;border-bottom:1px solid var(--lijn)}
.blad .kop h2{font:900 22px/1.1 var(--k);margin:0;flex:1}
.blad .kop small{display:block;font:600 13px/1.3 var(--f);color:var(--zacht);margin-top:3px}
.blad .x{width:44px;height:44px;border-radius:50%;border:0;background:#F2EBE0;font:800 20px/1 var(--f)}
.blad .in{overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.rij{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.rij{grid-template-columns:repeat(4,minmax(0,1fr))}}
.k{border:1.5px solid var(--lijn);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#fff}
.k .f{position:relative;aspect-ratio:1;border:0;padding:0;background:#fff;display:block;width:100%}
.k .f img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7%}
.k .t{padding:7px 10px 10px;display:flex;flex-direction:column;flex:1}
.k h3{font:700 13.5px/1.3 var(--f);margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k .r{display:flex;align-items:center;gap:6px;margin-top:auto}
.k .p{font:900 18px/1 var(--k);margin-right:auto}
.k-hart{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--lijn);background:#fff;display:grid;place-items:center;flex:none}
.k-hart svg{width:18px;height:18px}.k-hart[aria-pressed="true"] svg{fill:#E11D48;stroke:#E11D48}
.k .knop{display:flex;align-items:center;justify-content:center;min-height:42px;margin-top:8px;border-radius:12px;background:var(--inkt);color:#fff;text-decoration:none;font:800 13px/1 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.plekken{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:640px){.plekken{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plekken button{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1.5px solid var(--lijn);border-radius:14px;padding:6px 8px 6px 6px;min-height:58px}
.plekken img{width:44px;height:44px;object-fit:contain;border-radius:10px;flex:none}
.plekken b{display:block;font:800 14px/1.2 var(--f)}.plekken small{display:block;font:600 12px/1.2 var(--f);color:var(--zacht)}.plekken span{min-width:0}
.dek{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s}
.dek.open{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.hot .s::after{animation:none}.blad{transition:none}}
</style>
</head>

  <div class="plekken" id="plekken"></div>
</div>

<section class="blad" id="lade" aria-hidden="true"></section>
