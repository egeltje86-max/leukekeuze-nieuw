<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LeukeKeuze – voorbeeld B</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<!-- VOORBEELD B (15-11-2026): cadeauhulp als gesprek. Eén vraag tegelijk, antwoorden als knoppen, daarna 6 cadeaus in het gesprek. -->
<style>
:root{--bg:#F3F0FA;--inkt:#1E1A2B;--zacht:#6C6680;--paars:#5B3FD6;--paars-d:#4529B8;--wit:#FFFFFF;--lijn:#E4DEF3;--f:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--inkt);font:500 16px/1.5 var(--f);overflow-x:clip}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
.kop{position:sticky;top:0;z-index:20;background:rgba(243,240,250,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--lijn)}
.kop .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;height:64px;padding:0 max(16px,env(safe-area-inset-left))}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7B5CFA,#5B3FD6);display:grid;place-items:center;color:#fff;font:800 18px/1 var(--f);flex:none}
.kop b{display:block;font:800 17px/1.2 var(--f)}
.kop small{display:block;color:#2E9E62;font:700 12.5px/1.2 var(--f)}
.kop a{margin-left:auto;position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--inkt)}
.kop a svg{width:24px;height:24px}
.teller{position:absolute;top:4px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--paars);color:#fff;font:800 11px/18px var(--f);text-align:center}
.gesprek{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 160px;display:flex;flex-direction:column;gap:10px}
.bot,.ik{max-width:86%;padding:12px 16px;border-radius:22px;font-size:16.5px;line-height:1.45;animation:in .25s ease-out both}
.bot{background:var(--wit);border:1px solid var(--lijn);border-bottom-left-radius:6px;align-self:flex-start}
.ik{background:var(--paars);color:#fff;border-bottom-right-radius:6px;align-self:flex-end;font-weight:700}
.bot b{font-weight:800}
.typen{display:inline-flex;gap:5px;padding:16px 18px}
.typen i{width:8px;height:8px;border-radius:50%;background:#B9AFD8;animation:stip 1s infinite}
.typen i:nth-child(2){animation-delay:.15s}.typen i:nth-child(3){animation-delay:.3s}
@keyframes stip{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.keuzes{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px;animation:in .25s ease-out both}
.keuze{min-height:46px;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 6px;border-radius:999px;border:1.5px solid var(--paars);background:var(--wit);color:var(--paars-d);font:800 15.5px/1 var(--f);cursor:pointer}
.keuze.zonder{padding-left:16px}
.keuze img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff;border:1px solid var(--lijn)}
.keuze:hover{background:#EEE9FF}
.kaarten{display:grid;gap:12px;align-self:stretch;animation:in .3s ease-out both}
.kaart{display:grid;grid-template-columns:112px 1fr;gap:12px;background:var(--wit);border:1px solid var(--lijn);border-radius:20px;padding:10px;align-items:center}
.kaart .f{width:112px;height:112px;border-radius:14px;overflow:hidden;background:#fff;border:0;padding:0;cursor:pointer}
.kaart .f img{width:100%;height:100%;object-fit:contain}
.kaart h3{font:800 16px/1.25 var(--f);margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kaart .w{color:var(--zacht);font-size:13.5px;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kaart .rij{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kaart .p{font:800 17px/1 var(--f);margin-right:auto}
.kaart .k{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:var(--paars);color:#fff;text-decoration:none;font:800 14px/1 var(--f)}
.kaart .k svg{width:16px;height:16px}
.k-hart{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--lijn);background:#fff;display:grid;place-items:center;cursor:pointer}
.k-hart svg{width:20px;height:20px}
.k-hart[aria-pressed="true"] svg{fill:#E2466B;stroke:#E2466B}
.voet{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--bg) 70%,rgba(243,240,250,0));padding:18px max(16px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom))}
.voet .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.voet input{flex:1;min-width:0;min-height:52px;border-radius:999px;border:1.5px solid var(--lijn);background:#fff;padding:0 18px;font:600 16px/1 var(--f);color:var(--inkt);outline:0}
.voet input:focus{border-color:var(--paars)}
.voet button{width:52px;height:52px;border-radius:50%;border:0;background:var(--paars);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.voet button svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.bot,.ik,.keuzes,.kaarten{animation:none}.typen i{animation:none}}
@media (max-width:359px){.kaart{grid-template-columns:88px 1fr}.kaart .f{width:88px;height:88px}}
</style>
</head>
<body>
<header class="kop"><div class="in">
  <span class="av">✦</span><span><b>LeukeKeuze cadeauhulp</b><small>● Kiest met je mee</small></span>
  <a href="/nieuw/#/lijstje" aria-label="Mijn lijstje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><span class="teller" data-teller hidden></span></a>
</div></header>
<main class="gesprek" id="gesprek" aria-live="polite"></main>
<form class="voet" id="vrij"><div class="in">
  <input id="vrijtekst" type="text" placeholder="Of typ zelf, bijv. 'oma, tot 20 euro'" autocomplete="off" enterkeyhint="send" aria-label="Typ wat je zoekt">
  <button type="submit" aria-label="Versturen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div></form>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/topkeuze.js"></script>
<script src="/assets/js/producten-lean.js"></script>
<script src="/nieuw/kern.js"></script>
<script>
(function () {
  'use strict';
  var K = window.KERN, esc = K.esc, g = document.getElementById('gesprek');
  K.wisselBalk('B'); K.tel();
  var HIJ = { haar: 'ze', hem: 'hij', kinderen: 'het kind', tieners: 'die tiener', 'opa-oma': 'ze', collega: 'je collega', baby: 'de baby' };
  var NAAM = { haar: 'Voor haar', hem: 'Voor hem', kinderen: 'Een kind', tieners: 'Een tiener', 'opa-oma': 'Opa of oma', collega: 'Een collega', baby: 'Een baby' };
  var keus = {}, gezien = 0, resultaat = [];

  function scroll() { setTimeout(function () { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 30); }
  function zeg(html, dan) {
    var t = document.createElement('div'); t.className = 'bot typen'; t.innerHTML = '<i></i><i></i><i></i>'; g.appendChild(t); scroll();
    setTimeout(function () { t.className = 'bot'; t.innerHTML = html; scroll(); if (dan) dan(); }, 650);
  }
  function ik(tekst) { var d = document.createElement('div'); d.className = 'ik'; d.textContent = tekst; g.appendChild(d); scroll(); }
  function knoppen(lijst) {
    var d = document.createElement('div'); d.className = 'keuzes';
    d.innerHTML = lijst.map(function (k, i) { return '<button class="keuze' + (k.beeld ? '' : ' zonder') + '" type="button" data-i="' + i + '">' + (k.beeld ? '<img src="' + k.beeld + '" alt="">' : '') + esc(k.naam) + '</button>'; }).join('');
    d.addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (!b) return; var k = lijst[+b.getAttribute('data-i')]; d.remove(); ik(k.naam); k.doe(); });
    g.appendChild(d); scroll();
  }
  function fotoVan(sleutel) { var p = K.uitTop(sleutel).filter(function (x) { return !K.sieraad(x) && !K.drank(x); })[0]; return p ? K.klein(p) : ''; }

  function start() {
    keus = {};
    zeg('Hoi! 👋 Ik help je een leuk cadeau kiezen. <b>Voor wie zoek je iets?</b>', function () {
      knoppen(K.PERSONEN.map(function (x) { return { naam: NAAM[x.slug] || x.kort, beeld: fotoVan('/voor/' + x.slug), doe: function () { keus.wie = x; vraagOnderwerp(); } }; }));
    });
  }
  function vraagOnderwerp() {
    var x = keus.wie, subs = x.subs.filter(function (s) { return s.slug !== 'sieraden' && K.uitTop('/voor/' + x.slug + '/' + s.slug).length >= 6; }).slice(0, 7);
    zeg('Leuk! <b>Waar houdt ' + esc(HIJ[x.slug] || 'die') + ' van?</b>', function () {
      knoppen(subs.map(function (s) { return { naam: s.naam, beeld: fotoVan('/voor/' + x.slug + '/' + s.slug), doe: function () { keus.sub = s; vraagBedrag(); } }; })
        .concat([{ naam: 'Weet ik niet', doe: function () { keus.sub = null; vraagBedrag(); } }]));
    });
  }
  function vraagBedrag() {
    zeg('Top. <b>Hoeveel wil je ongeveer uitgeven?</b>', function () {
      knoppen([['Tot € 10', 10], ['Tot € 25', 25], ['Tot € 50', 50], ['Maakt niet uit', 0]].map(function (b) { return { naam: b[0], doe: function () { keus.max = b[1]; toon(); } }; }));
    });
  }
  function zoekLijst() {
    var x = keus.wie, basis = keus.sub ? K.uitTop('/voor/' + x.slug + '/' + keus.sub.slug).concat(K.uitTop('/voor/' + x.slug)) : K.uitTop('/voor/' + x.slug);
    var l = K.uniek(basis).filter(function (p) { return (!keus.max || p.prijs <= keus.max) && !K.sieraad(p); });
    return keus.sub ? l : l.slice(0, 6).concat(K.schud(l.slice(6), 3));
  }
  function kaart(p) {
    var r = K.reden(p);
    return '<article class="kaart"><button class="f" type="button" data-blad="' + esc(p.id) + '" aria-label="Meer over ' + esc(p.titel) + '"><img src="' + K.klein(p) + '" alt="" loading="lazy" decoding="async"></button>' +
      '<div><h3>' + esc(p.titel) + '</h3>' + (r ? '<p class="w">' + esc(r) + '</p>' : '') +
      '<div class="rij"><span class="p">' + K.euro(p.prijs) + '</span>' + K.hartKnop(p) + '<a class="k" href="' + K.winkelLink(p) + '" target="_blank" rel="sponsored nofollow noopener">' + esc(p.shop) + ' ' + K.ic('uit') + '</a></div></div></article>';
  }
  function toon() {
    resultaat = zoekLijst(); gezien = 0;
    if (!resultaat.length) { zeg('Hmm, voor dat bedrag heb ik hier nog niets moois. Zullen we een ander bedrag kiezen?', vraagBedrag); return; }
    zeg('Ik heb er ' + Math.min(6, resultaat.length) + ' voor je uitgezocht 🎁 Tik op een foto voor meer, of op het hartje om te bewaren.', meer);
  }
  function meer() {
    var stuk = resultaat.slice(gezien, gezien + 6); gezien += stuk.length;
    var d = document.createElement('div'); d.className = 'kaarten'; d.innerHTML = stuk.map(kaart).join(''); g.appendChild(d); scroll();
    var opties = [];
    if (gezien < resultaat.length) opties.push({ naam: 'Laat er nog 6 zien', doe: function () { zeg('Hier zijn er nog een paar:', meer); } });
    opties.push({ naam: 'Ander bedrag', doe: vraagBedrag });
    opties.push({ naam: 'Iemand anders', doe: start });
    setTimeout(function () { knoppen(opties); }, 300);
  }
  /* zelf typen: zoekt in onze eigen cadeaus, en herkent een bedrag ('tot 20', '20 euro') */
  document.getElementById('vrij').addEventListener('submit', function (e) {
    e.preventDefault(); var inp = document.getElementById('vrijtekst'), q = inp.value.trim(); if (!q) return; inp.value = ''; ik(q);
    document.querySelectorAll('.keuzes').forEach(function (k) { k.remove(); });
    var b = /(\d{1,3})\s*(euro|€)?/.exec(q), max = b ? +b[1] : 0;
    var woorden = q.toLowerCase().replace(/(tot|max|maximaal|onder|euro|€|\d+)/g, ' ').split(/\s+/).filter(function (w) { return w.length > 2 && !/^(voor|een|het|die|mijn|cadeau|kado|iets|leuk|leuke)$/.test(w); });
    var pers = K.PERSONEN.filter(function (x) { return woorden.some(function (w) { return x.slug.indexOf(w) !== -1 || (x.kort || '').toLowerCase().indexOf(w) !== -1 || (w === 'oma' || w === 'opa') && x.slug === 'opa-oma' || (w === 'vrouw' || w === 'vriendin' || w === 'moeder' || w === 'mama') && x.slug === 'haar' || (w === 'man' || w === 'vriend' || w === 'vader' || w === 'papa') && x.slug === 'hem' || (w === 'kind' || w === 'zoon' || w === 'dochter') && x.slug === 'kinderen'; }); })[0];
    var rest = woorden.filter(function (w) { return !/^(oma|opa|vrouw|vriendin|moeder|mama|man|vriend|vader|papa|kind|zoon|dochter|haar|hem|tiener|tieners|collega|baby)$/.test(w); });
    var gekozen = {}; Object.keys(K.TOP).forEach(function (k) { K.TOP[k].forEach(function (id) { gekozen[id] = 1; }); });
    var l;
    if (rest.length) l = K.ALLES.filter(function (p) { var t = (p.titel + ' ' + (p.merk || '') + ' ' + (p.vak || '')).toLowerCase(); return rest.every(function (w) { return t.indexOf(w) !== -1; }); }).sort(function (a, c) { return (gekozen[c.id] || 0) - (gekozen[a.id] || 0); });
    else if (pers) l = K.uitTop('/voor/' + pers.slug).filter(function (p) { return !K.sieraad(p); });
    else l = [];
    if (pers && rest.length) { var pl = {}; K.uitTop('/voor/' + pers.slug).forEach(function (p) { pl[p.id] = 1; }); l.sort(function (a, c) { return (pl[c.id] || 0) - (pl[a.id] || 0); }); }
    if (max) l = l.filter(function (p) { return p.prijs <= max; });
    resultaat = K.uniek(l); gezien = 0;
    if (!resultaat.length) { zeg('Daar vind ik niets voor in onze cadeaus. Zullen we het stap voor stap doen?', start); return; }
    zeg('Gevonden! Dit zijn er ' + Math.min(6, resultaat.length) + (resultaat.length > 6 ? ' van de ' + resultaat.length : '') + ':', meer);
  });
  start();
})();
</script>
</body>
</html>
