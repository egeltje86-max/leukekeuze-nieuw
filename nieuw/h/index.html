<style>

html,body{overflow-x:clip}

img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.boven{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--lijn)}
.boven .in{max-width:1200px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left)) 10px}
.titel{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.titel b{font:800 18px/1 var(--f);letter-spacing:-.3px}
.titel b span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.titel a{position:relative;width:40px;height:40px;display:grid;place-items:center;color:var(--inkt)}
.titel a svg{width:22px;height:22px}
.teller{position:absolute;top:2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent2);color:#fff;font:800 11px/18px var(--f);text-align:center}
.veld{position:relative;display:flex;align-items:center;gap:10px;background:var(--kaart);border:2px solid var(--lijn);border-radius:18px;padding:0 8px 0 16px;transition:border-color .15s,box-shadow .15s}
.veld:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.veld svg{width:22px;height:22px;flex:none;color:var(--accent)}
.veld input{flex:1;min-width:0;border:0;background:transparent;outline:0;min-height:56px;font:700 17px/1.2 var(--f);color:var(--inkt)}
.veld input::placeholder{color:var(--zacht);font-weight:600}
.wis{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--zacht);display:grid;place-items:center}
.wis[hidden]{display:none}
.begrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:0}
.begrip:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 6px 0 11px;border-radius:999px;font:800 13.5px/1 var(--f);border:0;background:var(--accentbg);color:var(--accent)}
.chip i{font-style:normal;font-weight:600;opacity:.75}
.chip .x{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);font-size:14px;line-height:1}
.chip.wie{background:#E0F2FE;color:#075985}.chip.geld{background:#DCFCE7;color:#166534}.chip.wat{background:#FCE7F3;color:#9D174D}.chip.moment{background:#FEF3C7;color:#92400E}.chip.anker{background:var(--inkt);color:var(--bg)}
@media (prefers-color-scheme:dark){.chip.wie{background:#0C2A3D;color:#7DD3FC}.chip.geld{background:#0B2E1C;color:#86EFAC}.chip.wat{background:#3A1028;color:#F9A8D4}.chip.moment{background:#3A2A08;color:#FCD34D}}
.chip.anker img{width:26px;height:26px;border-radius:50%;background:#fff;object-fit:contain;margin-left:-6px}
main{max-width:1200px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left)) 60px}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--zacht);font-size:13.5px;margin:2px 2px 10px}
.status b{color:var(--inkt)}
.snel{font-variant-numeric:tabular-nums;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--accentbg);color:var(--accent);font-weight:800}
.facet{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.facet::-webkit-scrollbar{display:none}
.facet button{flex:none;min-height:38px;padding:0 13px;border-radius:999px;border:1.5px solid var(--lijn);background:var(--kaart);font:700 13.5px/1 var(--f);white-space:nowrap}
.facet button em{font-style:normal;color:var(--zacht);font-weight:600;margin-left:4px}
.facet button[aria-pressed="true"]{background:var(--inkt);border-color:var(--inkt);color:var(--bg)}
.facet button[aria-pressed="true"] em{color:inherit;opacity:.7}
.voorbeelden h2{font:800 22px/1.2 var(--f);letter-spacing:-.4px;margin:10px 2px 4px}
.voorbeelden p{color:var(--zacht);margin:0 2px 14px}
.vb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.vb button{min-height:42px;padding:0 14px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--lijn));background:var(--kaart);font:700 14.5px/1.2 var(--f);text-align:left}
.vb button::before{content:'\201C';color:var(--accent);font-weight:800;margin-right:2px}
.vb button::after{content:'\201D';color:var(--accent);font-weight:800;margin-left:2px}
.raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.raster{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:980px){.raster{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kaart{position:relative;background:var(--kaart);border:1px solid var(--lijn);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;animation:in .22s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kaart .f{position:relative;display:block;width:100%;aspect-ratio:1;background:#fff;border:0;padding:0;overflow:hidden}
.kaart .f img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4%}
.kaart .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.kaart h3{font:700 14px/1.3 var(--f);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kaart .w{font-size:12px;color:var(--zacht);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kaart .r{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:4px}
.kaart .p{font:800 16px/1 var(--f);white-space:nowrap}
.kaart .op{flex:none;min-height:36px;min-width:36px;justify-content:center;padding:0 10px;border-radius:999px;border:1.5px solid var(--lijn);background:transparent;font:700 12.5px/1 var(--f);display:inline-flex;align-items:center;gap:5px;color:var(--accent)}
.kaart .op svg{width:15px;height:15px;flex:none}
.kaart .op b{font-weight:700}
.kaart .koop{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;margin:0 10px 10px;padding:0 8px;border-radius:12px;background:var(--inkt);color:var(--bg);text-decoration:none;font:800 13px/1 var(--f);white-space:nowrap;overflow:hidden}
.kaart .koop span{overflow:hidden;text-overflow:ellipsis}
.kaart .koop i{font-style:normal}
@media (max-width:639px){.kaart .koop i{display:none}.kaart .op b{display:none}.kaart .op{padding:0;border-radius:50%}}
.kaart .koop svg{width:15px;height:15px}
.kaart .k-hart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.15);display:grid;place-items:center;color:#111}
.kaart .k-hart svg{width:19px;height:19px}
.k-hart[aria-pressed="true"] svg{fill:#E11D48;stroke:#E11D48}
.meer{display:block;margin:18px auto 0;min-height:50px;padding:0 26px;border-radius:999px;border:0;background:var(--inkt);color:var(--bg);font:800 15px/1 var(--f)}
.leeg{text-align:center;color:var(--zacht);padding:40px 10px}
.leeg b{display:block;color:var(--inkt);font-size:18px;margin-bottom:6px}
.voet{color:var(--zacht);font-size:12.5px;text-align:center;margin-top:30px}
