<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LeukeKeuze – voorbeeld D</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<!-- VOORBEELD D (15-11-2026): fotomuur. Grote foto's in een muur, filters bovenaan, weinig tekst. -->
<style>
:root{--bg:#FAFAF7;--inkt:#111111;--zacht:#6B6B66;--geel:#FFD43B;--lijn:#E8E6DF;--wit:#FFFFFF;--f:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--inkt);font:500 16px/1.5 var(--f);overflow-x:clip}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
.kop{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 6px;display:flex;align-items:flex-end;gap:12px}
.kop h1{font:800 clamp(26px,7vw,40px)/1.05 var(--f);letter-spacing:-1px;margin:0}
.kop h1 span{background:linear-gradient(transparent 62%,var(--geel) 62%)}
.kop a{margin-left:auto;position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--inkt);flex:none}
.kop a svg{width:24px;height:24px}
.teller{position:absolute;top:4px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--inkt);color:#fff;font:800 11px/18px var(--f);text-align:center}
.sub{max-width:1280px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left));color:var(--zacht);font-size:15px}
.filters{position:sticky;top:0;z-index:20;background:rgba(250,250,247,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-top:10px}
.filters .in{max-width:1280px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left));scrollbar-width:none}
.filters .in::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--lijn);background:var(--wit);font:800 14.5px/1 var(--f);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--inkt);color:#fff;border-color:var(--inkt)}
.muur{max-width:1280px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-left)) 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:dense;gap:10px}
.tegel{position:relative;background:var(--wit);border-radius:18px;overflow:hidden;border:1px solid var(--lijn);min-width:0}
.tegel.groot{grid-column:span 2}
.tegel .f{display:block;width:100%;aspect-ratio:1;border:0;padding:0;background:#fff;cursor:pointer}
.tegel .f img{width:100%;height:100%;object-fit:contain;padding:8px}
.tegel.groot .f img{padding:16px}
.tegel .prijs{position:absolute;left:8px;top:8px;background:var(--geel);color:var(--inkt);font:800 14px/1 var(--f);padding:8px 10px;border-radius:999px}
.tegel .k-hart{position:absolute;right:8px;top:8px}
.tegel .t{padding:8px 12px 12px}
.tegel h3{font:700 14px/1.3 var(--f);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tegel.groot h3{font-size:17px}
.tegel .w{color:var(--zacht);font-size:13.5px;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k-hart{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:0 1px 4px rgba(0,0,0,.12);display:grid;place-items:center;cursor:pointer;color:var(--inkt)}
.k-hart svg{width:20px;height:20px}
.k-hart[aria-pressed="true"] svg{fill:#E2466B;stroke:#E2466B}
.meer{display:block;margin:4px auto 40px;min-height:52px;padding:0 28px;border-radius:999px;border:0;background:var(--inkt);color:#fff;font:800 15.5px/1 var(--f);cursor:pointer}
.leeg{grid-column:1/-1;text-align:center;color:var(--zacht);padding:40px 0}
@media (min-width:700px){.muur{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tegel.groot{grid-row:span 2}.tegel.groot .f{aspect-ratio:auto;height:calc(100% - 92px)}}
@media (min-width:1100px){.muur{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="kop"><h1>Kijk, <span>tik, geef.</span></h1>
  <a href="/nieuw/#/lijstje" aria-label="Mijn lijstje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><span class="teller" data-teller hidden></span></a>
</header>
<p class="sub">Een muur vol cadeaus die we zelf hebben uitgekozen. Tik op een foto voor meer.</p>
<nav class="filters" aria-label="Filters"><div class="in" id="filters"></div></nav>
<main class="muur" id="muur"></main>
<button class="meer" id="meer" type="button" hidden>Meer cadeaus</button>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/topkeuze.js"></script>
<script src="/assets/js/producten-lean.js"></script>
<script src="/nieuw/kern.js"></script>
<script>
(function () {
  'use strict';
  var K = window.KERN, esc = K.esc;
  K.wisselBalk('D'); K.tel();
  function schoon(l) { return K.uniek(l).filter(function (p) { return !K.sieraad(p); }); }
  function mix() { /* om en om uit de lijsten, zodat de muur gemengd is */
    var lijsten = Array.prototype.slice.call(arguments).map(schoon), uit = [], g = {}, max = Math.max.apply(null, lijsten.map(function (l) { return l.length; }));
    for (var i = 0; i < max; i++) lijsten.forEach(function (l) { var p = l[i]; if (p && !g[p.id]) { g[p.id] = 1; uit.push(p); } });
    return uit;
  }
  var t = K.uitTop;
  var F = [
    ['Alles', function () { return mix(t('/collectie/grappige-cadeaus'), t('/collectie/toppers-van-nu'), t('/voor/haar'), t('/voor/kinderen'), t('/voor/tieners'), t('/voor/hem'), t('/collectie/originele-cadeaus'), t('/voor/opa-oma')); }],
    ['Tot € 10', function () { return mix(t('/collectie/schoencadeautjes'), t('/c/cadeaus/onder-15'), t('/collectie/kleine-cadeautjes')).filter(function (p) { return p.prijs <= 10; }); }],
    ['Tot € 25', function () { return mix(t('/collectie/grappige-cadeaus'), t('/c/cadeaus/onder-15'), t('/voor/haar'), t('/voor/tieners'), t('/voor/hem'), t('/voor/kinderen')).filter(function (p) { return p.prijs <= 25; }); }],
    ['Voor haar', function () { return mix(t('/voor/haar')); }],
    ['Voor hem', function () { return mix(t('/voor/hem')); }],
    ['Kinderen', function () { return mix(t('/voor/kinderen'), t('/collectie/schoencadeautjes')); }],
    ['Tieners', function () { return mix(t('/voor/tieners'), t('/voor/tieners/kamer')); }],
    ['Opa en oma', function () { return mix(t('/voor/opa-oma')); }],
    ['Grappig', function () { return mix(t('/collectie/grappige-cadeaus')); }],
    ['Knus', function () { return mix(t('/voor/haar'), t('/voor/opa-oma'), t('/voor/tieners'), K.ALLES).filter(function (p) { return /pantoffel|slof|plaid|deken|kruik|hoodie|handwarmer/i.test(p.titel); }); }]
  ];
  var lijst = [], getoond = 0, keus = 0, PER = 24;
  var fl = document.getElementById('filters'), muur = document.getElementById('muur'), meerK = document.getElementById('meer');
  fl.innerHTML = F.map(function (f, i) { return '<button class="chip" type="button" data-f="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(f[0]) + '</button>'; }).join('');
  fl.addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; keus = +b.getAttribute('data-f'); fl.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', c === b); }); kies(); window.scrollTo({ top: 0 }); });
  function tegel(p, i) {
    var groot = i % 9 === 0, r = groot ? K.reden(p) : '';
    return '<article class="tegel' + (groot ? ' groot' : '') + '"><button class="f" type="button" data-blad="' + esc(p.id) + '" aria-label="' + esc(p.titel) + '"><img src="' + (groot ? K.groot(p) : K.klein(p)) + '" alt="" loading="' + (i < 4 ? 'eager' : 'lazy') + '" decoding="async"></button>' +
      '<span class="prijs">' + K.euro(p.prijs) + '</span>' + K.hartKnop(p) + '<div class="t"><h3>' + esc(p.titel) + '</h3>' + (r ? '<p class="w">' + esc(r) + '</p>' : '') + '</div></article>';
  }
  function kies() {
    lijst = F[keus][1](); if (keus === 0) { var a = lijst.filter(function (p) { return !K.drank(p); }); lijst = a.slice(0, 3).concat(lijst.filter(function (p) { return a.slice(0, 3).indexOf(p) === -1; })); }
    getoond = 0; muur.innerHTML = ''; meer();
  }
  function meer() {
    var stuk = lijst.slice(getoond, getoond + PER);
    if (!stuk.length && !getoond) muur.innerHTML = '<p class="leeg">Hier staat nog niets.</p>';
    muur.insertAdjacentHTML('beforeend', stuk.map(function (p, j) { return tegel(p, getoond + j); }).join(''));
    getoond += stuk.length; meerK.hidden = getoond >= lijst.length || getoond >= 120;
  }
  meerK.addEventListener('click', meer);
  kies();
})();
</script>
</body>
</html>
