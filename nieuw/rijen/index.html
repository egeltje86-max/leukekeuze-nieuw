     Alleen via de testlink /nieuw/rijen/ (noindex + Disallow: /nieuw/ in robots.txt). Op de echte site verandert niets.
     Geen vragen en geen filters: één pagina met rijen, elke rij is één soort cadeau, opzij vegen. Bovenaan wat Marius zelf koos.
     Er is maar één keuze en die hoeft niet: voor wie. 'Alles' bij een rij toont die hele soort.
     Volgorde in een rij: eerst wat Marius zelf in de Superkeurkamer koos (eigen.js), dan de handgekozen toppen, dan de rest;
     nooit twee uit hetzelfde vakje of met bijna dezelfde naam naast elkaar.

  function rondje(r, l) { return ICOON[r.id] ? '<span class="ri"><img src="' + ICOON[r.id] + '-klein.webp" alt="" loading="lazy"></span>' : (l && l[0] ? '<span class="ri foto"><img src="' + K.klein(l[0]) + '" alt="" loading="lazy"></span>' : ''); }

  var ALLES = K.ALLES.filter(function (p) {
    if (!(p.prijs > 0) || p.los || p.drank) return false;

  /* lange woorden netjes afbreken met de nagelezen tabel van de echte site (LK_AFBREEK) */
  var AFB = {}; (window.LK_AFBREEK || '').split('|').forEach(function (w) { if (w) AFB[w.replace(/-/g, '')] = w; });
  function zachtAf(t) { return String(t).replace(/[A-Za-zÀ-ÿ]{12,}/g, function (w) { var a = AFB[w.toLowerCase()]; if (!a) return w; var u = '', k = 0; for (var i = 0; i < a.length; i++) { if (a[i] === '-') u += '­'; else u += w[k++]; } return u; }); }
  /* korte naam op de kaart: zonder wat tussen haakjes staat of na een streepje; de hele naam staat in het blad als je erop tikt */
  function kortTitel(t) {
    var k = String(t || '').replace(/\s*\([^)]*\)/g, '').trim();
    var m = k.match(/^(.{12,}?)(\s+[–—]|:)\s+/); if (m) k = m[1];
    m = k.match(/^(.{16,}?),\s/); if (m) k = m[1];
    return k.length >= 6 ? k : String(t || '');
  }
  function kaart(p) {
    return '<article class="kaart"><button class="f" type="button" data-blad="' + esc(p.id) + '" aria-label="Meer over ' + esc(p.titel) + '"><img src="' + K.klein(p) + '" alt="" loading="lazy"></button><div class="in"><span class="t" data-blad="' + esc(p.id) + '" title="' + esc(p.titel) + '">' + esc(zachtAf(kortTitel(p.titel))) + '</span><span class="p">' + euro(p.prijs) + '</span><span class="w">bij ' + esc(p.shop) + '</span><a class="k" href="' + K.winkelLink(p) + '" target="_blank" rel="sponsored nofollow noopener" aria-label="Bekijk bij ' + esc(p.shop) + '">Bekijk' + PIJL + '</a></div></article>';
  }

  /* ---------- tekenen ---------- */
  var S = { wie: '', soort: '', n: 24 }, GEDUWD = false, PLEK = 0;
  function lees() {
    var h = new URLSearchParams((location.hash || '').slice(1));
    S.wie = WIE.some(function (w) { return w[0] && w[0] === h.get('wie'); }) ? h.get('wie') : '';
    S.soort = RIJP[h.get('soort')] ? h.get('soort') : '';
    S.n = 24;
  }
  function schrijf() { var h = new URLSearchParams(); if (S.wie) h.set('wie', S.wie); if (S.soort) h.set('soort', S.soort); var t = h.toString(); history.replaceState(null, '', t ? '#' + t : location.pathname); }
  function wieKnoppen() { document.getElementById('wie').innerHTML = WIE.map(function (w) { return '<button type="button" data-wie="' + w[0] + '" aria-pressed="' + (S.wie === w[0]) + '">' + esc(w[1]) + '</button>'; }).join(''); }
  function etalage() {
    var gezien = {}, html = '', L = {};
    RIJ.forEach(function (r) { if (!r.mix) L[r.id] = lijst(r, S.wie); });
    /* eerste rij: van elke andere rij het beste cadeau dat Marius zelf koos (anders het eerste), dus elke kaart een ander soort */
    RIJ.forEach(function (r) {
      if (!r.mix) return;
      var m = [], al = {};
      RIJ.forEach(function (x) { if (x.mix || x.id === 'schoen' || !L[x.id] || L[x.id].length < 6) return; var top = L[x.id].slice(0, 12).filter(function (q) { return !al[q.id] && !al[q.vak]; }), p = top.filter(function (q) { return EIGEN[q.id] != null; })[0] || top[0]; if (p) { al[p.id] = al[p.vak] = 1; m.push(p); } });
      L[r.id] = m;
    });
    RIJ.forEach(function (r) {
      var l = L[r.id];
      if (l.length < 6) return;
      /* wat al in een rij hoger stond komt niet nog eens vooraan in een volgende rij */
      var voor = r.mix ? l.slice(0, 14) : l.filter(function (p) { return !gezien[p.id]; }).concat(l.filter(function (p) { return gezien[p.id]; })).slice(0, 10);
      voor.forEach(function (p) { gezien[p.id] = 1; });
      html += '<section class="rij"><div class="rkop">' + rondje(r, l) + '<h2>' + esc(r.naam) + (r.uitleg ? '<small>' + esc(r.uitleg) + '</small>' : '') + '</h2>' + (r.mix ? '' : '<button type="button" class="alles" data-soort="' + r.id + '" aria-label="Alle ' + l.length + ' bekijken">Alles ' + l.length.toLocaleString('nl-NL') + PIJL + '</button>') + '</div>' +
        '<div class="band' + (r.mix ? ' mix' : '') + '">' + voor.map(kaart).join('') + (!r.mix && l.length > 10 ? '<button type="button" class="eind" data-soort="' + r.id + '"><i>' + PIJL + '</i>Alle ' + l.length.toLocaleString('nl-NL') + ' bekijken</button>' : '') + '</div></section>';
    });
    document.getElementById('rijen').innerHTML = html || '<p class="sub">Hier vonden we niets bij.</p>';
  }
  function soortPagina() {
    var r = RIJP[S.soort], l = lijst(r, S.wie), wie = WIE.filter(function (w) { return w[0] === S.wie; })[0][1];
    var el = document.getElementById('soort');
    el.innerHTML = '<button type="button" class="terug" data-terug>' + TERUG + 'Terug naar alle rijen</button><div class="rkop">' + rondje(r, l) + '<h1 style="margin:0">' + esc(r.naam) + '</h1></div>' +
      '<div class="wie" role="group" aria-label="Voor wie">' + WIE.map(function (w) { return '<button type="button" data-wie="' + w[0] + '" aria-pressed="' + (S.wie === w[0]) + '">' + esc(w[1]) + '</button>'; }).join('') + '</div>' +
      '<p class="aantal"><b>' + l.length.toLocaleString('nl-NL') + '</b> cadeaus' + (S.wie ? ' · ' + esc(wie.toLowerCase()) : '') + '</p>' +
      '<div class="grid">' + l.slice(0, S.n).map(kaart).join('') + '</div>' +
      (l.length > S.n ? '<p class="nog">Je ziet er ' + S.n + ' van ' + l.length.toLocaleString('nl-NL') + '</p><button class="meer" type="button" data-meer>Laat er nog 24 zien</button>' : '');
  }
  function teken() {
    var opSoort = !!S.soort;
    document.getElementById('etalage').hidden = opSoort; document.getElementById('soort').hidden = !opSoort;
    if (opSoort) soortPagina(); else { wieKnoppen(); etalage(); }
  }
  document.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-wie]'))) { S.wie = t.getAttribute('data-wie'); S.n = 24; schrijf(); teken(); return; }
    /* een soort openen telt als een nieuwe stap, zodat de terugknop van de telefoon weer bij de rijen uitkomt */
    if ((t = e.target.closest('[data-soort]'))) { var h = new URLSearchParams(); if (S.wie) h.set('wie', S.wie); h.set('soort', t.getAttribute('data-soort')); GEDUWD = true; location.hash = h.toString(); window.scrollTo(0, 0); return; }
    if (e.target.closest('[data-terug]')) { if (GEDUWD) { history.back(); return; } S.soort = ''; schrijf(); teken(); window.scrollTo(0, 0); return; }
    if (e.target.closest('[data-meer]')) { var oud = S.n; S.n += 24; teken(); var k = document.querySelectorAll('#soort .kaart')[oud]; if (k) k.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  });
  window.addEventListener('hashchange', function () { var was = S.soort; if (!was) PLEK = window.scrollY; lees(); teken(); if (was && !S.soort) { GEDUWD = false; window.scrollTo(0, PLEK); } });
  lees(); teken();
})();
</script>
</body>
</html>
