:root{--marine:#0A1020;--tekst:#141A2A;--creme:#F7F3EC;--ivoor:#FFFCF7;--goud:#B8862E;--dgoud:#8F6620;--lgoud:#F2CB74;--rand:#E5D7BE;--zacht:#5F667A;color-scheme:light}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--creme);color:var(--tekst);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:inherit}
img{max-width:100%;display:block}
.vul{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.breed{max-width:1180px;margin:0 auto}
/* testbalk */
.test{background:var(--marine);color:#E9E2D6;font-size:13px;text-align:center;padding-block:7px}
.test a{color:var(--lgoud);font-weight:700}
/* kop */
.kop{position:sticky;top:0;z-index:30;background:var(--ivoor);border-bottom:1px solid var(--rand)}
.kop .breed{display:flex;align-items:center;gap:12px;padding-block:8px}
.logo{font:700 21px/1 "Playfair Display",Georgia,serif;text-decoration:none;color:var(--marine);white-space:nowrap}
.logo b{color:var(--goud);font-weight:700}
.zoek{flex:1;min-width:0;display:flex}
.zoek input{flex:1;min-width:0;height:44px;border:1px solid var(--rand);border-radius:999px;padding:0 16px;font:15px Manrope,system-ui,sans-serif;background:#fff;color:var(--tekst)}
.zoek input:focus{outline:2px solid var(--goud);outline-offset:1px}
/* straat */
.welkom{padding-block:14px 0}
.welkom h1{font:700 clamp(26px,7vw,44px)/1.1 "Playfair Display",Georgia,serif;margin:0 0 6px;color:var(--marine);text-wrap:balance}
.welkom p{margin:0;color:var(--zacht);max-width:60ch}
.voorwie{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.voorwie span{font-weight:700;font-size:14px;align-self:center;margin-right:2px}
.voorwie a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:var(--ivoor);border:1px solid var(--rand);text-decoration:none;font-weight:700;font-size:14px}
.straat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;padding-block:14px 8px}
@media (min-width:700px){.straat{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 20px}}
@media (min-width:1000px){.straat{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stoep{height:14px;margin-top:-4px;background:repeating-linear-gradient(90deg,#DDD3C3 0 38px,#E8DFD1 38px 40px);border-radius:0 0 8px 8px}
/* gevel */
.gevel{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.luifel{position:relative;height:26px;border-radius:10px 10px 0 0;background:repeating-linear-gradient(90deg,var(--k) 0 18px,#fff 18px 36px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.luifel::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;background:radial-gradient(circle at 9px 0,var(--k) 8.5px,transparent 9px) 0 0/36px 9px repeat-x,radial-gradient(circle at 27px 0,#fff 8.5px,transparent 9px) 0 0/36px 9px repeat-x}
.pui{background:var(--ivoor);border:3px solid var(--k);border-top:0;border-radius:0 0 12px 12px;padding:16px 10px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.bord{font:700 16px/1.2 "Playfair Display",Georgia,serif;color:var(--marine);text-align:center;text-wrap:balance;overflow-wrap:anywhere;min-height:2.4em;display:grid;place-items:center}
.raam{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--k);padding:4px;border-radius:8px}
.raam span{background:#fff;aspect-ratio:1;border-radius:4px;overflow:hidden;display:block}
.raam img{width:100%;height:100%;object-fit:contain;padding:4px}
.deur{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--zacht);line-height:1.3}
.deur b{color:var(--marine);white-space:nowrap}
.gevel:hover .bord,.gevel:focus-visible .bord{text-decoration:underline;text-decoration-color:var(--goud)}
.gevel:focus-visible{outline:3px solid var(--goud);outline-offset:4px;border-radius:12px}
.seizoen{display:inline-block;align-self:center;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dgoud)}
/* winkel binnen */

.binnen-kop{margin-top:4px}

.binnen-kop .pui{padding:22px 16px 16px;border-width:4px}

.binnen-kop .tel{font-size:14px}
.let{background:#FFF4E5;border:1px solid #F0D5A8;border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.extra{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.extra a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--marine);color:#fff;text-decoration:none;font-weight:800;font-size:14.5px}
.plattegrond{padding-block:10px 14px;margin-top:10px;border-bottom:1px solid var(--rand)}
.plattegrond h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dgoud);margin:0 0 6px;font-weight:800}

.wegwijzer a{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 11px;border-radius:999px;background:var(--ivoor);border:1px solid var(--rand);text-decoration:none;font-weight:700;font-size:13.5px;color:var(--marine)}
.wegwijzer a small{font-weight:600;color:var(--zacht);font-size:12px}
.wegwijzer.dicht a:nth-child(n+7){display:none}
.wegwijzer button{min-height:38px;padding:0 12px;border-radius:999px;border:1px dashed var(--goud);background:transparent;font:800 13.5px Manrope,system-ui,sans-serif;color:var(--dgoud);cursor:pointer}
.gang{padding-block:22px 4px;scroll-margin-top:72px}
.gang-kop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.gang-kop img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.gang-kop div{min-width:0}
.gang-kop small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dgoud)}
.gang-kop h2{font:700 21px/1.2 "Playfair Display",Georgia,serif;margin:0;color:var(--marine);text-wrap:balance}
.schap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.pk{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--rand);border-radius:16px;padding:8px;cursor:pointer;font:inherit;color:inherit;min-width:0;box-shadow:0 1px 3px rgba(10,16,32,.05)}
.pk:focus-visible{outline:3px solid var(--goud);outline-offset:2px}
.pk-foto{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff;display:block}
.pk-foto img{width:100%;height:100%;object-fit:contain}
.pk-t{font-size:14px;line-height:1.3;font-weight:600;margin:8px 2px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;overflow-wrap:anywhere}

      ] },
    { id: 'tuincentrum', naam: 'Het Tuincentrum', zin: 'Planten, vogelhuisjes, buiten zitten, klussen en iets voor je huisdier.', k: '#4F8A2E', ic: 'tuin-klussen',
      gangen: [

      ] },
    { id: 'uitjesbureau', naam: 'Het Uitjesbureau', zin: 'Een dag om nooit te vergeten: racen, vliegen, workshops en uitjes.', k: '#2A8FC1', ic: 'belevenissen',
      gangen: [

      ] },
    { id: 'christelijk', naam: 'De Christelijke boekwinkel', zin: 'Bijbels, doopcadeaus, kerststallen en teksten voor aan de muur.', k: '#23395B', ic: 'christelijk',
      gangen: [
        { naam: 'Doop & belijdenis', g: 'christelijk/doop-belijdenis-kinderen' }, { naam: 'Bijbels & boeken', g: 'christelijk/bijbels-boeken' },
        { naam: 'Kerst', g: 'christelijk/kerst' }, { naam: 'Teksten aan de muur', g: 'christelijk/wanddecoratie-teksten' },
        { naam: 'Sieraden', g: 'christelijk/sieraden' }
      ] }
  ].filter(function (w) { return inSeizoen(w.seizoen); });

  /* Wat in een handgekozen top staat, telt als 'etalage' (met de hand nagekeken). */
  var ETALAGE = {};
  Object.keys(K.TOP).forEach(function (k) { (K.TOP[k] || []).forEach(function (id, i) { if (ETALAGE[id] === undefined || i < ETALAGE[id]) ETALAGE[id] = i; }); });

  function magIn(w, p) {
    if (!w.drank && (p.drank || K.drank(p))) return false;
    if (w.drank && !(p.drank || K.drank(p) || p.afd === 'eten-drinken')) return false;
    if (GROF.test(p.titel)) return false;
    if (p.prijs < 3) return false;
    if (w.super && p.prijs > w.super) return false;
    return true;
  }
  var GRAP = {}; ['/collectie/grappige-cadeaus', '/collectie/grappige-cadeaus/hem', '/collectie/grappige-cadeaus/haar', '/collectie/grappige-cadeaus/kinderen', '/collectie/grappige-cadeaus/tieners', '/collectie/grappige-cadeaus/collega'].forEach(function (k) { (K.TOP[k] || []).forEach(function (id) { GRAP[id] = 1; }); });
  function ookVan(p, ook) { return (p.ookIn || []).indexOf(ook) !== -1 || (ook === 'cadeaus/grappig' && GRAP[p.id]); }
  function wieVan(p, wie) {
    if (!wie) return true;
    var v = p.voor || [];
    if (wie === 'volw') return v.some(function (x) { return /^(haar|hem|collega|opa-oma|iedereen)$/.test(x); });
    if (wie === 'kind') return v.indexOf('kind') !== -1 || v.indexOf('kinderen') !== -1;
    if (wie === 'tiener') return v.indexOf('tiener') !== -1;
    return v.indexOf(wie) !== -1 || (/^(hem|haar|collega)$/.test(wie) && v.indexOf('iedereen') !== -1);
  }
  function inGang(g, p) {
    var pad = p.afd + '/' + p.groep, vpad = pad + '/' + p.vak;
    if (g.hoek && p[g.hoek]) return true;
    if (g.g) { var gs = [].concat(g.g); if (gs.indexOf(pad) !== -1) return true; }
    if (g.v && g.v.indexOf(vpad) !== -1) return true;
    if (g.afd && g.afd.indexOf(p.afd) !== -1) return true;
    return false;
  }
  function naarVan(g) {
    if (g.naar) return g.naar;
    if (g.g) return '/c/' + [].concat(g.g)[0];
    if (g.v) return '/c/' + g.v[0];
    return '/';
  }
  function ordenen(lijst, sleutels) {
    var eerst = [];
    sleutels.forEach(function (s) { (GEZ[s] || []).slice(0, 3).forEach(function (id) { eerst.push(id); }); });
    sleutels.forEach(function (s) { (K.TOP[s] || []).forEach(function (id) { eerst.push(id); }); });
    var in_ = {}; lijst.forEach(function (p) { in_[p.id] = p; });
    var uit = [], gezien = {};
    eerst.forEach(function (id) { var p = in_[id]; if (p && !gezien[id]) { gezien[id] = 1; uit.push(p); } });
    var rest = lijst.filter(function (p) { return !gezien[p.id]; });
    rest.sort(function (a, b) {
      var ea = ETALAGE[a.id] === undefined ? 999 : ETALAGE[a.id], eb = ETALAGE[b.id] === undefined ? 999 : ETALAGE[b.id];
      if ((ea < 999) !== (eb < 999)) return ea < 999 ? -1 : 1;
      if (!!a.zk !== !!b.zk) return a.zk ? -1 : 1;
      return ea - eb;
    });
    return uit.concat(rest);
  }
  /* Niet twee bijna dezelfde naast elkaar: eerste twee woorden van de titel */
  function sleutelVan(p) { return String(p.titel).toLowerCase().replace(/[^a-z0-9à-ü ]/g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).join(' '); }
  function spreid(lijst) {
    var uit = [], wacht = [], laatste = {};
    lijst.forEach(function (p) {
      var s = sleutelVan(p), v = p.vak;
      var bots = uit.slice(-3).some(function (q) { return sleutelVan(q) === s || (q.vak === v && uit.length < 4 && uit.filter(function (r) { return r.vak === v; }).length >= 2); });
      if (bots) wacht.push(p); else uit.push(p);
    });
    return uit.concat(wacht);
  }

  /* Bouw per winkel de gangen met hun cadeaus */
  WINKELS.forEach(function (w) {
    var alle = {};
    w.gangen.forEach(function (g) {
      var lijst;
      if (g.ook) lijst = ordenen(K.ALLES.filter(function (p) { return magIn(w, p) && ookVan(p, g.ook) && wieVan(p, g.wie) && (!g.max || p.prijs <= g.max); }), [g.top, g.ook === 'cadeaus/grappig' ? '/collectie/grappige-cadeaus' : '/c/' + g.ook]);
      else if (g.top) lijst = K.uitTop(g.top).filter(function (p) { return magIn(w, p); });
      else {
        lijst = K.ALLES.filter(function (p) { return magIn(w, p) && inGang(g, p) && (!w.super || ETALAGE[p.id] !== undefined); });
        var sl = [];
        if (g.g) [].concat(g.g).forEach(function (x) { sl.push('/c/' + x); });
        if (g.v) g.v.forEach(function (x) { sl.push('/c/' + x); });
        if (g.afd) g.afd.forEach(function (x) { sl.push('/c/' + x); });
        if (w.super) sl.push('/c/cadeaus/onder-15', '/collectie/schoencadeautjes', '/collectie/kleine-cadeautjes');
        lijst = ordenen(lijst, sl);
      }
      g.lijst = spreid(lijst);
      g.lijst.forEach(function (p) { alle[p.id] = p; });
    });
    w.gangen = w.gangen.filter(function (g) { return g.lijst.length >= 2; });
    var ps = Object.keys(alle).map(function (id) { return alle[id]; });
    w.aantal = ps.length;
    w.van = ps.reduce(function (m, p) { return Math.min(m, p.prijs); }, 1e9);
    /* Etalage: het eerste cadeau uit de eerste vier gangen, elk een ander */
    var raam = [], g2 = {};
    for (var r = 0; r < 3 && raam.length < 4; r++) w.gangen.forEach(function (g) { var p = g.lijst[r]; if (p && !g2[p.id] && raam.length < 4) { g2[p.id] = 1; raam.push(p); } });
    w.raam = raam;
  });

  function rond(ic) {
    if (!ic) return '';
    return /\.webp$/.test(ic) ? '/' + ic : '/images/categorieen/rond/cat-' + ic + '.webp';
  }
  function gangIcoon(w, g) {
    if (g.ic) return rond(g.ic);
    if (g.hoek && g.lijst[0]) return K.klein(g.lijst[0]);
    var x = g.g ? [].concat(g.g)[0] : (g.v ? g.v[0].split('/').slice(0, 2).join('/') : '');
    return x ? '/images/sub/iconen/icoon-' + x.replace('/', '-') + '.webp' : rond(w.ic);
  }
  function getal(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  function gevel(w) {
    return '<a class="gevel" href="#' + w.id + '" style="--k:' + w.k + '" aria-label="' + esc(w.naam + ': ' + w.zin) + '">' +
      '<span class="luifel"></span><span class="pui">' +
      (w.label ? '<span class="seizoen">' + esc(w.label) + '</span>' : '') +
      '<span class="bord">' + esc(w.naam) + '</span>' +
      '<span class="raam">' + w.raam.map(function (p) { return '<span><img loading="lazy" src="' + K.klein(p) + '" alt=""></span>'; }).join('') + '</span>' +
      '<span class="deur"><span>' + getal(w.aantal) + ' cadeaus</span><b>Naar binnen ›</b></span>' +
      '</span><span class="stoep"></span></a>';
  }

  function kaart(p) {
    return '<button class="pk" type="button" data-blad="' + esc(p.id) + '">' +
      '<span class="pk-foto"><img loading="lazy" src="' + K.klein(p) + '" alt=""></span>' +
      '<span class="pk-t">' + esc(p.titel) + '</span>' +
      '<span class="pk-p">' + euro(p.prijs) + '</span>' +
      '<span class="pk-w">bij ' + esc(p.shop || '') + '</span></button>';
  }

  var PER_KEER = 4, MAX_IN_GANG = 12;

  function straat() {
    document.title = 'LeukeKeuze – de Cadeaustraat';
    var pers = [['Voor haar', '/voor/haar'], ['Voor hem', '/voor/hem'], ['Kinderen', '/voor/kinderen'], ['Tieners', '/voor/tieners'], ['Opa & oma', '/voor/opa-oma'], ['Collega', '/voor/collega'], ['Baby', '/voor/baby']];
    return '<section class="welkom"><h1>De Cadeaustraat</h1>' +
      '<p>Loop een winkel binnen. Alles in de etalage is echt te koop.</p></section>' +
      '<section class="straat" aria-label="De winkels">' + WINKELS.map(gevel).join('') + '</section>' +
      '<div class="voorwie"><span>Of zoek je voor iemand?</span>' + pers.map(function (x) { return '<a href="' + x[1] + '">' + x[0] + '</a>'; }).join('') + '</div>' +
      '<p class="voet">Dit is een voorbeeld. De cadeaus, prijzen en links zijn dezelfde als op de gewone site.</p>';
  }

  function winkel(w) {
    document.title = w.naam + ' – LeukeKeuze';
    var i = WINKELS.indexOf(w), buren = [WINKELS[(i + 1) % WINKELS.length], WINKELS[(i + 2) % WINKELS.length]];
    var h = '<a class="terug" href="#straat">‹ Terug naar de straat</a>' +
      '<section class="binnen-kop gevel" style="--k:' + w.k + '"><span class="luifel"></span><div class="pui">' +
      '<h1>' + esc(w.naam) + '</h1><p>' + esc(w.zin) + '</p>' +
      '<p class="tel">' + getal(w.aantal) + ' cadeaus · vanaf ' + euro(w.van) + '</p>' +
      (w.let ? '<p class="let">' + esc(w.let) + '</p>' : '') +
      (w.extra ? '<div class="extra">' + w.extra.map(function (x) { return '<a href="' + x[1] + '">' + esc(x[0]) + '</a>'; }).join('') + '</div>' : '') +
      '</div></section>';
    var veel = w.gangen.length > 6;
    h += '<nav class="plattegrond" aria-label="Afdelingen"><h2>Afdelingen</h2><div class="wegwijzer' + (veel ? ' dicht' : '') + '">' +
      w.gangen.map(function (g, n) { return '<a href="#' + w.id + '" data-gang="' + n + '">' + esc(g.naam) + ' <small>' + g.lijst.length + '</small></a>'; }).join('') +
      (veel ? '<button type="button" data-alle-gangen>+ ' + (w.gangen.length - 6) + ' meer</button>' : '') + '</div></nav>';
    w.gangen.forEach(function (g, n) {
      h += '<section class="gang" id="gang-' + n + '"><div class="gang-kop"><img src="' + gangIcoon(w, g) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
        '<div><small>Afdeling ' + (n + 1) + '</small><h2>' + esc(g.naam) + '</h2></div></div>' +
        '<div class="schap" data-schap="' + n + '">' + g.lijst.slice(0, PER_KEER).map(kaart).join('') + '</div>' +
        '<div class="gang-voet">' + (g.lijst.length > PER_KEER ? '<button class="meer" type="button" data-meer="' + n + '">Laat er nog ' + Math.min(PER_KEER, g.lijst.length - PER_KEER) + ' zien</button>' : '') +
        '<a class="naar" href="' + (w.super ? w.naar : naarVan(g)) + '">Alles uit deze afdeling ›</a></div></section>';
    });
    h += '<section class="verder"><h2>Verder in de straat</h2><div class="straat">' + buren.map(gevel).join('') + '</div>' +
      '<a class="terug" href="#straat">‹ Terug naar het begin van de straat</a></section>';
    return h;
  }

  var app = document.getElementById('app'), huidig = null;
  function teken() {
    var id = (location.hash || '').slice(1), w = WINKELS.filter(function (x) { return x.id === id; })[0];
    huidig = w || null;
    app.innerHTML = w ? winkel(w) : straat();
    window.scrollTo(0, 0);
  }
  app.addEventListener('click', function (e) {
    var m = e.target.closest('[data-meer]');
    if (m && huidig) {
      var n = +m.getAttribute('data-meer'), g = huidig.gangen[n], schap = app.querySelector('[data-schap="' + n + '"]');
      var nu = schap.children.length, erbij = g.lijst.slice(nu, Math.min(nu + PER_KEER, MAX_IN_GANG));
      schap.insertAdjacentHTML('beforeend', erbij.map(kaart).join(''));
      var over = Math.min(g.lijst.length, MAX_IN_GANG) - schap.children.length;
      if (over > 0) m.textContent = 'Laat er nog ' + Math.min(PER_KEER, over) + ' zien'; else m.remove();
      return;
    }
    var gw = e.target.closest('[data-gang]');
    if (gw) { e.preventDefault(); var doel = document.getElementById('gang-' + gw.getAttribute('data-gang')); if (doel) doel.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var ag = e.target.closest('[data-alle-gangen]');
    if (ag) { ag.parentNode.classList.remove('dicht'); ag.remove(); }
  });
  window.addEventListener('hashchange', teken);
  teken();
})();
