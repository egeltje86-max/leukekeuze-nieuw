<!-- TESTVOORBEELD 'De Cadeaustraat' (21-11-2026, Marius: 'meschien winkels is beter, de game winkel, de speelgoed winkel met afdelingen
     zoals in het echt dat je door de winkels loopt, of koffie huizen, een supermarkt, een gall en gall, maak voorbeelden'; 'ik wil de ultieme cadeau website').
     Elke afdeling van de site is een winkel in een straat. In de etalage staan echte cadeaus; binnen staan de gangen (de groepen van de site)
     met meteen vier cadeaus en een link naar de echte pagina. Niet in Google (noindex + Disallow /nieuw/ in robots.txt); de echte site verandert niet. -->
<style>
:root{--marine:#0A1020;--tekst:#141A2A;--creme:#F7F3EC;--ivoor:#FFFCF7;--goud:#B8862E;--dgoud:#8F6620;--lgoud:#F2CB74;--rand:#E5D7BE;--zacht:#5F667A;color-scheme:light}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--creme);color:var(--tekst);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:inherit}
img{max-width:100%;display:block}
.vul{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.breed{max-width:1180px;margin:0 auto}
/* testbalk */
.test{background:var(--marine);color:#E9E2D6;font-size:13px;text-align:center;padding-block:7px}
.test a{color:var(--lgoud);font-weight:700}
/* kop */
.kop{position:sticky;top:0;z-index:30;background:var(--ivoor);border-bottom:1px solid var(--rand)}
.kop .breed{display:flex;align-items:center;gap:12px;padding-block:8px}
.logo{font:700 21px/1 "Playfair Display",Georgia,serif;text-decoration:none;color:var(--marine);white-space:nowrap}
.logo b{color:var(--goud);font-weight:700}
.zoek{flex:1;min-width:0;display:flex}
.zoek input{flex:1;min-width:0;height:44px;border:1px solid var(--rand);border-radius:999px;padding:0 16px;font:15px Manrope,system-ui,sans-serif;background:#fff;color:var(--tekst)}
.zoek input:focus{outline:2px solid var(--goud);outline-offset:1px}
/* straat */
.welkom{padding-block:14px 0}
.welkom h1{font:700 clamp(26px,7vw,44px)/1.1 "Playfair Display",Georgia,serif;margin:0 0 6px;color:var(--marine);text-wrap:balance}
.welkom p{margin:0;color:var(--zacht);max-width:60ch}
.voorwie{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.voorwie span{font-weight:700;font-size:14px;align-self:center;margin-right:2px}
.voorwie a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:var(--ivoor);border:1px solid var(--rand);text-decoration:none;font-weight:700;font-size:14px}
.straat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;padding-block:14px 8px}
@media (min-width:700px){.straat{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 20px}}
@media (min-width:1000px){.straat{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stoep{height:14px;margin-top:-4px;background:repeating-linear-gradient(90deg,#DDD3C3 0 38px,#E8DFD1 38px 40px);border-radius:0 0 8px 8px}
/* gevel */
.gevel{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.luifel{position:relative;height:26px;border-radius:10px 10px 0 0;background:repeating-linear-gradient(90deg,var(--k) 0 18px,#fff 18px 36px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.luifel::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;background:radial-gradient(circle at 9px 0,var(--k) 8.5px,transparent 9px) 0 0/36px 9px repeat-x,radial-gradient(circle at 27px 0,#fff 8.5px,transparent 9px) 0 0/36px 9px repeat-x}
.pui{background:var(--ivoor);border:3px solid var(--k);border-top:0;border-radius:0 0 12px 12px;padding:16px 10px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.bord{font:700 16px/1.2 "Playfair Display",Georgia,serif;color:var(--marine);text-align:center;text-wrap:balance;overflow-wrap:anywhere;min-height:2.4em;display:grid;place-items:center}
.raam{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--k);padding:4px;border-radius:8px}
.raam span{background:#fff;aspect-ratio:1;border-radius:4px;overflow:hidden;display:block}
.raam img{width:100%;height:100%;object-fit:contain;padding:4px}
.deur{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;color:var(--zacht);line-height:1.3}
.deur b{color:var(--marine);white-space:nowrap}
.gevel:hover .bord,.gevel:focus-visible .bord{text-decoration:underline;text-decoration-color:var(--goud)}
.gevel:focus-visible{outline:3px solid var(--goud);outline-offset:4px;border-radius:12px}
.seizoen{display:inline-block;align-self:center;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dgoud)}
/* winkel binnen */
.terug{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:700;text-decoration:none;color:var(--marine)}
.binnen-kop{margin-top:4px}
.binnen-kop .luifel{height:34px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,var(--k) 0 26px,#fff 26px 52px)}
.binnen-kop .luifel::after{bottom:-12px;height:12px;background:radial-gradient(circle at 13px 0,var(--k) 12.5px,transparent 13px) 0 0/52px 12px repeat-x,radial-gradient(circle at 39px 0,#fff 12.5px,transparent 13px) 0 0/52px 12px repeat-x}
.binnen-kop .pui{padding:22px 16px 16px;border-width:4px}
.binnen-kop h1{font:700 clamp(26px,6.5vw,40px)/1.1 "Playfair Display",Georgia,serif;margin:0;color:var(--marine);text-align:center;text-wrap:balance}
.binnen-kop p{margin:0;text-align:center;color:var(--zacht);font-size:15px}
.binnen-kop .tel{font-size:14px}
.let{background:#FFF4E5;border:1px solid #F0D5A8;border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.extra{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.extra a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--marine);color:#fff;text-decoration:none;font-weight:800;font-size:14.5px}
.plattegrond{padding-block:10px 14px;margin-top:10px;border-bottom:1px solid var(--rand)}
.plattegrond h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dgoud);margin:0 0 6px;font-weight:800}
.wegwijzer{display:flex;flex-wrap:wrap;gap:6px}
.wegwijzer a{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 11px;border-radius:999px;background:var(--ivoor);border:1px solid var(--rand);text-decoration:none;font-weight:700;font-size:13.5px;color:var(--marine)}
.wegwijzer a small{font-weight:600;color:var(--zacht);font-size:12px}
.wegwijzer.dicht a:nth-child(n+7){display:none}
.wegwijzer button{min-height:38px;padding:0 12px;border-radius:999px;border:1px dashed var(--goud);background:transparent;font:800 13.5px Manrope,system-ui,sans-serif;color:var(--dgoud);cursor:pointer}
.gang{padding-block:22px 4px;scroll-margin-top:72px}
.gang-kop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.gang-kop img{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.gang-kop div{min-width:0}
.gang-kop small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dgoud)}
.gang-kop h2{font:700 21px/1.2 "Playfair Display",Georgia,serif;margin:0;color:var(--marine);text-wrap:balance}
.schap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.schap{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.pk{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--rand);border-radius:16px;padding:8px;cursor:pointer;font:inherit;color:inherit;min-width:0;box-shadow:0 1px 3px rgba(10,16,32,.05)}
.pk:focus-visible{outline:3px solid var(--goud);outline-offset:2px}
.pk-foto{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff;display:block}
.pk-foto img{width:100%;height:100%;object-fit:contain}
.pk-t{font-size:14px;line-height:1.3;font-weight:600;margin:8px 2px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;overflow-wrap:anywhere}
.pk-p{font-weight:800;font-size:16px;margin:auto 2px 2px;color:var(--marine)}
.pk-w{font-size:12px;color:var(--zacht);margin:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gang-voet{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px}
.meer{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--marine);background:var(--ivoor);font:800 14.5px Manrope,system-ui,sans-serif;color:var(--marine);cursor:pointer}
.naar{font-weight:800;font-size:14.5px;color:var(--dgoud);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.naar:hover{text-decoration:underline}
.verder{padding-block:30px 10px}
.verder h2{font:700 22px/1.2 "Playfair Display",Georgia,serif;margin:0 0 12px;color:var(--marine)}
.voet{padding-block:30px 40px;color:var(--zacht);font-size:13.5px;text-align:center}


/* ===== GEZELLIG (21-11-2026, Marius: 'maak het fraaier, gezelliger') ===== */

ight%3D%225%22%20rx%3D%221%22%20fill%3D%22%234A4036%22%2F%3E%3Cellipse%20cx%3D%22210%22%20cy%3D%2221%22%20rx%3D%224.6%22%20ry%3D%226.2%22%20fill%3D%22%23F2CB74%22%2F%3E%3Cellipse%20cx%3D%22208.5%22%20cy%3D%2219%22%20rx%3D%221.4%22%20ry%3D%222.2%22%20fill%3D%22%23fff%22%20opacity%3D%22.7%22%2F%3E%3Ccircle%20cx%3D%22270%22%20cy%3D%2222%22%20r%3D%2210%22%20fill%3D%22%235A8FD8%22%20opacity%3D%22.22%22%2F%3E%3Crect%20x%3D%22267.5%22%20y%3D%2210%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%234A4036%22%2F%3E%3Cellipse%20cx%3D%22270%22%20cy%3D%2221%22%20rx%3D%224.6%22%20ry%3D%226.2%22%20fill%3D%22%235A8FD8%22%2F%3E%3Cellipse%20cx%3D%22268.5%22%20cy%3D%2219%22%20rx%3D%221.4%22%20ry%3D%222.2%22%20fill%3D%22%23fff%22%20opacity%3D%22.7%22%2F%3E%3Ccircle%20cx%3D%22330%22%20cy%3D%2222%22%20r%3D%2210%22%20fill%3D%22%23E0533D%22%20opacity%3D%22.22%22%2F%3E%3Crect%20x%3D%22327.5%22%20y%3D%2210%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%234A4036%22%2F%3E%3Cellipse%20cx%3D%22330%22%20cy%3D%2221%22%20rx%3D%224.6%22%20ry%3D%226.2%22%20fill%3D%22%23E0533D%22%2F%3E%3Cellipse%20cx%3D%22328.5%22%20cy%3D%2219%22%20rx%3D%221.4%22%20ry%3D%222.2%22%20fill%3D%22%23fff%22%20opacity%3D%22.7%22%2F%3E%3C%2Fsvg%3E") repeat-x center top/360px 40px;margin:4px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;pointer-events:none}
.welkom{text-align:center}
.welkom .straatbord{display:inline-block;background:var(--marine);color:#fff;font:700 clamp(24px,7vw,34px)/1 "Playfair Display",Georgia,serif;padding:12px 22px 13px;border-radius:10px;box-shadow:inset 0 0 0 3px var(--marine),inset 0 0 0 5px #fff,0 6px 14px -6px rgba(10,16,32,.5);margin:6px 0 0;letter-spacing:.2px}
.welkom .straatbord small{display:block;font:800 10.5px/1 Manrope,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--lgoud);margin-bottom:6px}
.welkom p{margin:8px auto 0}
.gevel .pui{background:#FFFCF7;background:color-mix(in srgb,var(--k) 9%,#FFFCF7)}
.luifel{background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,.1)),repeating-linear-gradient(90deg,var(--k) 0 18px,#fff 18px 36px)}
.bord{background:#FFFDF8;border:1.5px solid var(--goud);border-radius:8px;padding:5px 6px;box-shadow:0 2px 0 rgba(143,102,32,.22)}
.aantal{text-align:center;font-size:12.5px;color:var(--zacht);margin-top:-2px}
.raam{box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 20px rgba(242,203,116,.5)}
.raam span{background:#FFFBF0}
.deur{justify-content:center}
.deur .deurtje{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;background:var(--kd);color:#fff;border-radius:14px 14px 4px 4px;font-weight:800;font-size:13.5px;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.deurtje::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;margin-top:-2px;border-radius:50%;background:var(--lgoud)}
.gevel.dicht .deur .deurtje{background:#6B717A}
.stoep{height:16px;background-color:#CDBDA2;background-image:linear-gradient(90deg,rgba(90,70,50,.2) 1px,transparent 1px),linear-gradient(0deg,rgba(90,70,50,.2) 1px,transparent 1px);background-size:18px 8px;border-radius:0 0 8px 8px;margin-top:-2px}
.binnen .extra a{background:var(--kd);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.binnen .wegwijzer a{border-color:#E5D7BE;border-color:color-mix(in srgb,var(--k) 30%,#E5D7BE)}
.binnen .wegwijzer a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k);flex:none}
.binnen .gang,.top-etalage{background:#FFFCF7;background:color-mix(in srgb,var(--k) 6%,#FFFCF7);border:1px solid var(--rand);border-bottom:9px solid #B98A5C;border-radius:18px 18px 10px 10px;padding:16px 10px 12px;margin-top:20px;box-shadow:0 8px 14px -10px rgba(80,50,20,.45)}
.top-etalage{--k:#8F6620}
.binnen .gang-kop small,.top-etalage .gang-kop small{color:var(--kd)}
.binnen .gang-kop img,.top-etalage .gang-kop img{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--k)}
.binnen .pk-p,.top-etalage .pk-p{align-self:flex-start;background:var(--kd);color:#fff;padding:3px 10px 3px 15px;border-radius:4px 12px 12px 4px;position:relative;font-size:15px;margin-top:auto}
.binnen .pk-p::before,.top-etalage .pk-p::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#fff}
.binnen .pk-w,.top-etalage .pk-w{margin-top:4px}
.binnen .meer,.top-etalage .meer{border-color:var(--k);border-width:2px}
.binnen .naar,.top-etalage .naar{color:var(--kd)}
.binnen-kop .pui{box-shadow:0 10px 20px -14px rgba(80,50,20,.5)}

/* voor wie en hoeveel */
.kies{background:var(--ivoor);border:1px solid var(--rand);border-radius:18px;padding:14px 12px 12px;margin-top:14px;box-shadow:0 1px 3px rgba(10,16,32,.05)}
.kies h2{font:700 19px/1.2 "Playfair Display",Georgia,serif;margin:0 0 10px;color:var(--marine);text-align:center}
.kies h2+div+h2{margin-top:16px}
.kies-wie{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
@media (min-width:700px){.kies-wie{grid-template-columns:repeat(8,minmax(0,1fr))}}
.kies-wie a{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:var(--tekst);min-height:44px}
.kr{position:relative;width:64px;height:64px;border-radius:50%;background:#fff;border:2px solid var(--rand);overflow:visible;display:block}
.kr img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.kn{font-size:13.5px;font-weight:700;text-align:center;line-height:1.15}
.kies a.aan .kr{border:3px solid var(--goud);box-shadow:0 0 0 3px #F6E7C4}
.kies a.aan .kr::after,.kies a.aan .munt::after{content:"✓";position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--marine);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;line-height:1}
.kies a.aan .kn{color:var(--marine);text-decoration:underline;text-decoration-color:var(--goud);text-decoration-thickness:2px;text-underline-offset:3px}
.kies-geld{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.kies-geld a{text-decoration:none;color:var(--marine)}
.munt{position:relative;width:60px;height:60px;border-radius:50%;background:var(--m);border:2px solid var(--rand);display:grid;place-content:center;text-align:center;font-weight:800;font-size:15px;line-height:1.05}

  function gidsKaart(sl) {

    return '<a class="gids-k" href="' + pad('gids/' + sl) + '"><span class="gk-foto">' + (b ? '<img loading="lazy" src="' + b + '" alt="">' : '<img class="gk-leeg" loading="lazy" src="' + novaRond('winkel-kiosk') + '" alt="">') + '</span>' +
      '<span class="gk-t">' + afbr(GIDS[sl][0]) + '</span><span class="gk-l">Lees de gids ›</span></a>';
  }
  function kioskGevel(st) {
    var rek = kioskRekken(st), raam = [];
    rek.forEach(function (x) { x.gidsen.forEach(function (sl) { if (raam.length < 4 && gidsBeeld(sl) && raam.indexOf(sl) === -1) raam.push(sl); }); });
    if (raam.length < 4) return '';
    var w = KIOSK;
    return '<a class="gevel nova" href="' + adres('kiosk', st.pr.wie, st.max) + '" style="--k:' + w.k + '" aria-label="De Kiosk: onze cadeaugidsen">' +
      '<span class="gv"><span class="gv-raam kiosk">' + raam.map(function (sl) { return '<span><img loading="lazy" decoding="async" src="' + gidsBeeld(sl) + '" alt=""></span>'; }).join('') + '</span>' +
      gvBeeld(w.gevel) + gvBord(w.naam) + '<span class="gv-deur">Naar binnen</span></span><span class="stoep"></span><span class="gv-onder">cadeaugidsen</span></a>';
  }
  function kiosk(st) {
    var w = KIOSK, rek = kioskRekken(st);
    document.title = w.naam + ' – LeukeKeuze';
    var h = '<a class="terug" href="' + adres('', st.pr.wie, st.max) + '">‹ Terug naar de straat' + (st.pr.wie ? ' ' + esc(st.pr.tekst) : '') + '</a><div class="lampjes" aria-hidden="true"></div>' +
      '<section class="binnen-kop gevel nova kiosk-kop" style="--k:' + w.k + '"><span class="luifel"></span><span class="ik ik-leeg"><img class="embleem" src="' + novaRond('winkel-kiosk') + '" alt=""></span>' +
      '<div class="pui"><h1>' + esc(w.naam) + '</h1><p>' + esc(w.zin) + '</p>' +
      (st.pr.wie ? '<p class="filter">Je ziet alleen gidsen <b>' + esc(st.pr.tekst) + '</b> · <a href="' + adres('kiosk', '', 0) + '">alle gidsen</a></p>' : '') + '</div></section>';
    h += '<nav class="plattegrond" aria-label="Rekken"><h2>Rekken</h2><div class="afd-kaarten">' +
      rek.map(function (x, n) { return '<a class="afd" href="' + adres('kiosk', st.pr.wie, st.max) + '" data-gang="' + n + '"><img src="' + novaRond(x.r.ic) + '" alt="" loading="lazy"><span>' + afbr(x.r.naam) + '</span><i aria-hidden="true">›</i></a>'; }).join('') + '</div></nav>';
    rek.forEach(function (x, n) {
      h += '<section class="gang" id="gang-' + n + '"><div class="gang-kop"><img src="' + novaRond(x.r.ic) + '" alt="" loading="lazy"><div><small>Rek ' + (n + 1) + '</small><h2>' + afbr(x.r.naam) + '</h2></div></div>' +
        '<div class="schap" data-schap="k' + n + '">' + x.gidsen.slice(0, PER_KEER).map(gidsKaart).join('') + '</div>' +
        (x.gidsen.length > PER_KEER ? '<div class="gang-voet"><button class="meer" type="button" data-kmeer="' + n + '">Laat er nog ' + Math.min(PER_KEER, x.gidsen.length - PER_KEER) + ' zien</button></div>' : '') + '</section>';
    });
    h += '<a class="terug" href="' + adres('', st.pr.wie, st.max) + '">‹ Terug naar het begin van de straat</a>';
    return h;
  }

  var app = document.getElementById('app'), huidig = null, naarStraat = false;
  function teken() {
    var a = leesAdres(), st = staat(a.wie, a.max);
    var x = a.winkel ? st.open.concat(st.dicht).filter(function (y) { return y.w.id === a.winkel; })[0] : null;
    huidig = x ? { x: x, st: st } : { st: st };
    if (a.winkel === 'kiosk') { huidig = { kiosk: kioskRekken(st), st: st }; app.innerHTML = '<div class="binnen" style="--k:' + KIOSK.k + '">' + kiosk(st) + '</div>'; }
    else app.innerHTML = x ? '<div class="binnen" style="--k:' + x.w.k + '">' + winkel(x, st) + '</div>' : straat(st);
    if (a.winkel === 'kiosk') x = true;
    var doel = naarStraat && !x ? document.getElementById('straat-kop') : null;
    naarStraat = false;
    if (doel) doel.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
  }
  app.addEventListener('click', function (e) {
    if (e.target.closest('[data-kies]')) naarStraat = true;
    /* de pop-up krijgt de kleur van de winkel waar je het cadeau ziet */
    var pb = e.target.closest('[data-blad]'), kb = document.querySelector('.k-blad');
    if (pb && kb) { var kl = getComputedStyle(pb).getPropertyValue('--k').trim() || '#8F6620'; kb.style.setProperty('--k', kl); kb.style.setProperty('--kd', 'color-mix(in srgb,' + kl + ' 72%,#000)'); }
    var km = e.target.closest('[data-kmeer]');
    if (km && huidig && huidig.kiosk) {
      var kn = +km.getAttribute('data-kmeer'), kl2 = huidig.kiosk[kn].gidsen, ks = app.querySelector('[data-schap="k' + kn + '"]'), nu0 = ks.children.length;
      ks.insertAdjacentHTML('beforeend', kl2.slice(nu0, nu0 + PER_KEER).map(gidsKaart).join(''));
      var over0 = kl2.length - ks.children.length;
      if (over0 > 0) km.textContent = 'Laat er nog ' + Math.min(PER_KEER, over0) + ' zien'; else km.parentNode.remove();
      return;
    }
    var m = e.target.closest('[data-meer]');
    if (m && huidig) {
      var n = m.getAttribute('data-meer'), lijst = n === 'top' ? huidig.st.etalage : huidig.x.gangen[+n].lijst, schap = app.querySelector('[data-schap="' + n + '"]');
      var nu = schap.children.length, erbij = lijst.slice(nu, Math.min(nu + PER_KEER, MAX_IN_GANG));
      schap.insertAdjacentHTML('beforeend', erbij.map(kaart).join(''));
      var over = Math.min(lijst.length, MAX_IN_GANG) - schap.children.length;
      if (over > 0) m.textContent = 'Laat er nog ' + Math.min(PER_KEER, over) + ' zien'; else m.remove();
      return;
    }
    var gw = e.target.closest('[data-gang]');
    if (gw) { e.preventDefault(); var d = document.getElementById('gang-' + gw.getAttribute('data-gang')); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var ag = e.target.closest('[data-alle-gangen]');
    if (ag) { ag.parentNode.classList.remove('dicht'); ag.remove(); }
    var nk = e.target.closest('[data-naar-kies]');
    if (nk) { var k = app.querySelector('.kies'); if (k) k.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  /* Terug naar waar je was: met de terugknop kom je weer op dezelfde plek in de straat of winkel (21-11-2026) */
  var POS = {}, vorige = location.hash, vooruit = false;
  document.addEventListener('click', function (e) { var a = e.target.closest && e.target.closest('a[href^="#"]'); if (a) vooruit = true; }, true);
  window.addEventListener('hashchange', function () {
    POS[vorige] = window.scrollY;
    var terug = !vooruit; vooruit = false; vorige = location.hash;
    teken();
    if (terug && POS[location.hash] !== undefined) window.scrollTo(0, POS[location.hash]);
  });
  teken();
})();
</script>
</body>
</html>
