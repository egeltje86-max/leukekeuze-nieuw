<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LeukeKeuze – dit of dat</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/assets/css/fonts.css">
<!-- VOORBEELD J (15-11-2026, Marius: 'maak ze alle drie, ik wil ze ervaren'): dit of dat.
     Voor wie en hoeveel, dan steeds twee cadeaus: tik welke je leuker vindt. Na elke tik leert de site je smaak
     (soort, groep, prijs, stijl en merk krijgen punten) en kiest hij een slimmer volgend paar. Na zes keuzes verschijnen
     24 cadeaus die bij je smaak passen; elke volgende keuze schuift die lijst meteen bij. -->
<style>
:root{--bg:#FFF8F1;--inkt:#1F1633;--zacht:#6E6585;--links:#FF5A3C;--rechts:#3B5BFF;--paars:#7C3AED;--lijn:#EFE4D8;--wit:#FFFFFF;--f:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--k:'Playfair Display',Georgia,serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--inkt);font:600 16px/1.45 var(--f)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 60px}
h1{font:800 clamp(30px,9vw,44px)/1 var(--f);letter-spacing:-1.2px;margin:6px 0 4px;text-align:center}
h1 .l{color:var(--links)}h1 .r{color:var(--rechts)}h1 .o{font:italic 700 .7em/1 var(--k);color:var(--zacht);margin:0 6px}
.sub{text-align:center;color:var(--zacht);margin:0 0 18px;font-size:15px}
.stap h2{font:800 20px/1.2 var(--f);margin:6px 0 12px;text-align:center}
.wie{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.wie{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wie button{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:8px 8px 12px;background:var(--wit);border:2px solid var(--lijn);border-radius:20px;font:800 15.5px/1.2 var(--f)}
.wie button span{display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#fff}
.wie button img{width:100%;height:100%;object-fit:contain;padding:6%}
.wie button:active{transform:scale(.97)}
.geld{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.geld button{min-height:56px;padding:0 22px;border-radius:18px;border:2px solid var(--lijn);background:var(--wit);font:800 17px/1 var(--f)}
.geld button:active{transform:scale(.97)}
.terug{display:block;margin:16px auto 0;border:0;background:none;color:var(--zacht);text-decoration:underline;font:700 14px/1 var(--f);min-height:44px}
.voortgang{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px;font:800 13.5px/1 var(--f);color:var(--zacht)}
.balk{flex:1;height:8px;border-radius:4px;background:#F1E6DA;overflow:hidden}
.balk i{display:block;height:100%;background:linear-gradient(90deg,var(--links),var(--paars),var(--rechts));border-radius:4px;transition:width .4s}
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kies{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--wit);border:3px solid var(--lijn);border-radius:22px;padding:8px 8px 12px;transition:transform .25s,opacity .25s,border-color .2s;min-width:0}
.kies.l{border-color:#FFD3C9}.kies.r{border-color:#CBD5FF}
.kies .f{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#fff}
.kies .f img{width:100%;height:100%;object-fit:contain;padding:5%}
.kies b{font:800 14.5px/1.3 var(--f);margin:8px 2px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.kies em{font-style:normal;font:800 17px/1 var(--f);margin:0 2px}
.kies.l em{color:var(--links)}.kies.r em{color:var(--rechts)}
.kies:active{transform:scale(.97)}
.kies.wint{transform:scale(1.04);border-color:var(--paars);z-index:2}
.kies.verliest{opacity:.25;transform:scale(.94)}
.of{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font:italic 700 20px/1 var(--k);z-index:3;box-shadow:0 0 0 5px var(--bg);pointer-events:none}
.beide{display:flex;gap:10px;justify-content:center;margin-top:12px}
.beide button{min-height:46px;padding:0 16px;border-radius:999px;border:2px solid var(--lijn);background:var(--wit);font:800 14px/1 var(--f)}
.smaak{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 0;min-height:32px}
.smaak span{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:999px;background:#EFE7FF;color:var(--paars);font:800 13px/1 var(--f);animation:pop .3s ease-out both}
.smaak .lbl{background:none;color:var(--zacht);padding:0 2px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.uitslag{margin-top:26px}
.uitslag h2{font:800 22px/1.2 var(--f);letter-spacing:-.4px;margin:0 2px 4px}
.uitslag p.u{color:var(--zacht);margin:0 2px 12px;font-size:14.5px}
.raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.raster{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kaart{position:relative;background:var(--wit);border:1px solid var(--lijn);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;animation:pop .3s ease-out both}
.kaart .f{position:relative;display:block;aspect-ratio:1;border:0;padding:0;background:#fff;width:100%}
.kaart .f img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4%}
.kaart .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.kaart h3{margin:0;font:700 14px/1.3 var(--f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kaart .p{font:800 16px/1 var(--f);margin-top:auto}
.kaart .koop{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;margin:0 10px 10px;border-radius:12px;background:var(--inkt);color:#fff;text-decoration:none;font:800 13px/1 var(--f);white-space:nowrap;overflow:hidden;padding:0 8px}
.kaart .koop span{overflow:hidden;text-overflow:ellipsis}.kaart .koop svg{width:15px;height:15px;flex:none}
.kaart .jij{position:absolute;left:8px;top:8px;background:var(--paars);color:#fff;font:800 11.5px/1 var(--f);padding:6px 9px;border-radius:999px;z-index:2}
.k-hart{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:0 1px 4px rgba(0,0,0,.15);display:grid;place-items:center;z-index:2;color:var(--inkt)}
.k-hart svg{width:19px;height:19px}
.k-hart[aria-pressed="true"] svg{fill:#E11D48;stroke:#E11D48}
.meer{display:block;margin:16px auto 0;min-height:50px;padding:0 24px;border-radius:999px;border:0;background:var(--inkt);color:#fff;font:800 15px/1 var(--f)}
.opnieuw{display:block;margin:22px auto 0;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--lijn);background:var(--wit);font:800 14px/1 var(--f)}
@media (prefers-reduced-motion:reduce){.kies,.kaart,.smaak span{transition:none;animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="l">Dit</span><span class="o">of</span><span class="r">dat</span></h1>
  <p class="sub">Tik steeds welk cadeau je leuker vindt. Wij leren je smaak.</p>
  <main id="app"></main>
</div>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/topkeuze.js"></script>
<script src="/assets/js/producten-lean.js"></script>
<script src="/nieuw/kern.js"></script>
<script>
(function () {
  'use strict';
  var K = window.KERN, esc = K.esc, app = document.getElementById('app');
  K.wisselBalk('J');
  var GNAAM = {}, VNAAM = {};
  (window.LK_CATEGORIEEN || []).forEach(function (c) { (c.subs || []).forEach(function (s) { GNAAM[c.slug + '/' + s.slug] = s.naam; (s.vakjes || []).forEach(function (v) { VNAAM[c.slug + '/' + s.slug + '/' + v.slug] = v.naam; }); }); });
  var WIE = [['Voor haar', 'haar', '/voor/haar'], ['Voor hem', 'hem', '/voor/hem'], ['Een kind', 'kind', '/voor/kinderen'], ['Een tiener', 'tiener', '/voor/tieners'], ['Opa of oma', 'opa-oma', '/voor/opa-oma'], ['Een collega', 'collega', '/voor/collega'], ['Een baby', 'baby', '/voor/baby'], ['Weet ik niet', null, '/collectie/grappige-cadeaus']];
  var GELD = [['Tot € 10', 10], ['Tot € 25', 25], ['Tot € 50', 50], ['Maakt niet uit', 0]];
  var keus = {}, pool = [], W = {}, gezien = {}, gekozen = {}, afgewezen = {}, ronde = 0, RONDES = 6, toon = 24, prior = {};

  function past(p, wie) {
    if (K.sieraad(p)) return false; var v = p.voor || [], l = p.leeftijd;
    if ((wie === 'kind' || wie === 'tiener' || wie === 'baby') && K.drank(p)) return false;
    if (!wie) return !K.drank(p);
    if (wie === 'kind') return v.indexOf('kind') >= 0 || v.indexOf('kinderen') >= 0 || (l && l[0] < 12);
    if (wie === 'tiener') return v.indexOf('tiener') >= 0 || (v.indexOf('iedereen') >= 0 && !(l && l[0] >= 18));
    if (wie === 'baby') return v.indexOf('baby') >= 0;
    return v.indexOf(wie) >= 0 || v.indexOf('iedereen') >= 0;
  }
  function band(pr) { return pr <= 10 ? 'tot € 10' : pr <= 25 ? '€ 10 – 25' : pr <= 50 ? '€ 25 – 50' : 'boven € 50'; }
  /* kenmerken van een cadeau, met gewicht */
  function kenmerken(p) {
    var f = [['v:' + p.afd + '/' + p.groep + '/' + p.vak, 1], ['g:' + p.afd + '/' + p.groep, .7], ['a:' + p.afd, .35], ['b:' + band(p.prijs), .3]];
    (p.soort || []).forEach(function (s) { f.push(['s:' + s, .5]); });
    (p.tags || []).slice(0, 4).forEach(function (t) { f.push(['t:' + t, .35]); });
    if (p.merk) f.push(['m:' + p.merk, .45]);
    return f;
  }
  function score(p) { var s = prior[p.id] || 0; kenmerken(p).forEach(function (f) { s += (W[f[0]] || 0) * f[1]; }); if (afgewezen[p.id]) s -= 3; if (gekozen[p.id]) s += 2; return s; }
  function leer(p, hoeveel) { kenmerken(p).forEach(function (f) { W[f[0]] = (W[f[0]] || 0) + hoeveel; }); }

  /* stap 1: voor wie */
  function stapWie() {
    app.innerHTML = '<section class="stap"><h2>Voor wie zoek je iets?</h2><div class="wie">' + WIE.map(function (x, i) {
      var p = K.uitTop(x[2]).filter(function (p) { return !K.sieraad(p) && !K.drank(p); })[0];
      return '<button type="button" data-wie="' + i + '"><span>' + (p ? '<img src="' + K.klein(p) + '" alt="" loading="lazy">' : '') + '</span>' + esc(x[0]) + '</button>'; }).join('') + '</div></section>';
  }
  function stapGeld() {
    app.innerHTML = '<section class="stap"><h2>Hoeveel wil je ongeveer uitgeven?</h2><div class="geld">' + GELD.map(function (x, i) { return '<button type="button" data-geld="' + i + '">' + esc(x[0]) + '</button>'; }).join('') + '</div><button class="terug" type="button" data-opnieuw>Terug</button></section>';
  }
  function start() {
    W = {}; gezien = {}; gekozen = {}; afgewezen = {}; ronde = 0; toon = 24; prior = {};
    var top = K.uitTop(WIE[keus.wie][2]); top.forEach(function (p, i) { prior[p.id] = 1.4 * (1 - i / Math.max(80, top.length)); });
    pool = K.ALLES.filter(function (p) { return past(p, WIE[keus.wie][1]) && (!keus.max || p.prijs <= keus.max); });
    pool.forEach(function (p) { prior[p.id] = (prior[p.id] || 0) + (p.rang || 0) * .5; });
    app.innerHTML = '<div class="voortgang"><span id="tel"></span><span class="balk"><i id="balk" style="width:0"></i></span></div><div id="duel"></div><div class="smaak" id="smaak"></div><section class="uitslag" id="uitslag" hidden></section>';
    nieuwPaar();
  }

  /* een slim paar kiezen: eerst verschillende hoeken verkennen, daarna verfijnen */
  var paar = [];
  function nieuwPaar() {
    var vrij = pool.filter(function (p) { return !gezien[p.id]; });
    if (vrij.length < 2) { gezien = {}; vrij = pool.slice(); }
    var gesorteerd = vrij.map(function (p) { return [p, score(p) + Math.random() * (ronde < 3 ? 1.2 : .4)]; }).sort(function (a, b) { return b[1] - a[1]; }).map(function (x) { return x[0]; });
    var a, b;
    if (ronde < 3) { var hoeken = {}; Object.keys(gezien).forEach(function (id) { var p = K.PER[id]; if (p) hoeken[p.afd] = 1; });
      a = gesorteerd.slice(0, 80).find(function (p) { return !hoeken[p.afd]; }) || gesorteerd[0];
      b = gesorteerd.slice(0, 120).find(function (p) { return p.afd !== a.afd && !hoeken[p.afd]; }) || gesorteerd.find(function (p) { return p.afd !== a.afd; }) || gesorteerd[1]; }
    else { a = gesorteerd[0]; b = gesorteerd.slice(1, 60).find(function (p) { return p.groep !== a.groep; }) || gesorteerd[1]; }
    paar = [a, b]; gezien[a.id] = 1; gezien[b.id] = 1;
    var na = ronde >= RONDES;
    document.getElementById('tel').textContent = na ? 'Nog beter maken? Kies gerust verder' : 'Keuze ' + (ronde + 1) + ' van ' + RONDES;
    document.getElementById('balk').style.width = Math.min(100, ronde / RONDES * 100) + '%';
    document.getElementById('duel').innerHTML = '<div class="duel">' + [a, b].map(function (p, i) { return '<button type="button" class="kies ' + (i ? 'r' : 'l') + '" data-kies="' + i + '"><span class="f"><img src="' + K.groot(p) + '" alt=""></span><b>' + esc(p.titel) + '</b><em>' + K.euro(p.prijs) + '</em></button>'; }).join('') + '<span class="of">of</span></div>' +
      '<div class="beide"><button type="button" data-beide="niet">Allebei niet</button><button type="button" data-beide="wel">Allebei leuk</button></div>';
  }
  function kies(i) {
    var w = paar[i], v = paar[1 - i];
    leer(w, 1); leer(v, -.7); gekozen[w.id] = 1; afgewezen[v.id] = 1;
    if (document.querySelector('.kies.wint')) return; var kn = document.querySelectorAll('.kies'); kn[i].classList.add('wint'); kn[1 - i].classList.add('verliest');
    verder();
  }
  function beide(wel) { paar.forEach(function (p) { leer(p, wel ? .6 : -.8); if (wel) gekozen[p.id] = 1; else afgewezen[p.id] = 1; }); verder(); }
  function verder() { ronde++; try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} smaak(); setTimeout(function () { nieuwPaar(); if (ronde >= RONDES) uitslag(ronde === RONDES); }, 330); }

  /* jouw smaak in woorden */
  var SOORT = { origineel: 'origineel', praktisch: 'praktisch', luxe: 'luxe', persoonlijk: 'persoonlijk' };
  function smaak() {
    var top = Object.keys(W).filter(function (k) { return W[k] > .9 && /^(g|s|b|v):/.test(k); }).sort(function (a, b) { return W[b] - W[a]; }), uit = [], g = {};
    top.forEach(function (k) { if (uit.length >= 4) return; var t = k.slice(2), n;
      if (k[0] === 'v') n = VNAAM[t]; else if (k[0] === 'g') n = GNAAM[t]; else if (k[0] === 's') n = SOORT[t]; else n = t;
      if (n && !g[n]) { g[n] = 1; uit.push(n); } });
    document.getElementById('smaak').innerHTML = uit.length ? '<span class="lbl">Je smaak:</span>' + uit.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') : '';
  }
  /* de lijst die bij je smaak past */
  function uitslag(eerste) {
    var el = document.getElementById('uitslag'), lijst = pool.filter(function (p) { return !afgewezen[p.id]; }).map(function (p) { return [p, score(p)]; }).sort(function (a, b) { return b[1] - a[1]; }).map(function (x) { return x[0]; });
    var g = {}, gemengd = [], later = [];
    lijst.forEach(function (p) { var k = p.afd + '/' + p.groep + '/' + p.vak; g[k] = (g[k] || 0) + 1; (g[k] <= 3 ? gemengd : later).push(p); });
    lijst = gemengd.concat(later);
    el.hidden = false;
    el.innerHTML = '<h2>Dit past bij je smaak</h2><p class="u">' + lijst.length.toLocaleString('nl-NL') + ' cadeaus, de beste bovenaan. Kies hierboven verder, dan schuift de lijst meteen bij.</p><div class="raster">' +
      lijst.slice(0, toon).map(function (p, i) { return '<article class="kaart" style="animation-delay:' + Math.min(i, 12) * 25 + 'ms">' + (gekozen[p.id] ? '<span class="jij">Jouw keuze</span>' : '') + '<button class="f" type="button" data-blad="' + esc(p.id) + '" aria-label="' + esc(p.titel) + '"><img src="' + K.klein(p) + '" alt="" loading="lazy"></button>' + K.hartKnop(p) +
        '<div class="t"><h3>' + esc(p.titel) + '</h3><span class="p">' + K.euro(p.prijs) + '</span></div><a class="koop" href="' + K.winkelLink(p) + '" target="_blank" rel="sponsored nofollow noopener"><span>Bekijk bij ' + esc(p.shop) + '</span>' + K.ic('uit') + '</a></article>'; }).join('') + '</div>' +
      (lijst.length > toon ? '<button class="meer" type="button" data-meer>Laat er nog 24 zien</button>' : '') + '<button class="opnieuw" type="button" data-opnieuw>Opnieuw, voor iemand anders</button>';
    if (eerste) setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200);
  }

  app.addEventListener('click', function (e) {
    var x;
    if ((x = e.target.closest('[data-wie]'))) { keus.wie = +x.getAttribute('data-wie'); stapGeld(); window.scrollTo({ top: 0 }); return; }
    if ((x = e.target.closest('[data-geld]'))) { keus.max = GELD[+x.getAttribute('data-geld')][1]; start(); return; }
    if ((x = e.target.closest('[data-kies]'))) { kies(+x.getAttribute('data-kies')); return; }
    if ((x = e.target.closest('[data-beide]'))) { beide(x.getAttribute('data-beide') === 'wel'); return; }
    if (e.target.closest('[data-meer]')) { toon += 24; uitslag(false); return; }
    if (e.target.closest('[data-opnieuw]')) { keus = {}; stapWie(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  stapWie();
})();
</script>
</body>
</html>
