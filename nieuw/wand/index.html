<!-- TESTVERSIE 'De Cadeauwand' (16-11-2026, Marius: 'het is een doolhof, dingen staan verstopt, alles is onduidelijk';
     'verzin een super systeem waardoor we geen categorieën nodig hebben en het toch duidelijk is voor de klant wat hij kan kiezen').
     Alleen via de testlink /nieuw/wand/ (noindex + Disallow: /nieuw/ in robots.txt). Op de echte site verandert niets.
     Geen boom (afdeling > groep > vakje) meer, maar één wand met alle cadeaus en vier vragen erboven: Voor wie? Hoeveel? Wat voor iets? Waarvoor?
     Alles los te kiezen, in elke volgorde, de cadeaus veranderen meteen. Bij elke keuze het aantal; een keuze met 0 verdwijnt (nooit een lege pagina).
     Onderzoek: bij een grote, gemengde verzameling waarin één ding bij meerdere soorten hoort (een chocoladeletter is chocolade, Sinterklaas,
     voor een kind én onder € 10) werkt filteren op kenmerken beter dan een boom, want in een boom moet de klant raden waar iets staat
     (Nielsen Norman Group over faceted navigation; Baymard over filters met aantallen en zichtbare gekozen filters).
     Versie 2 (16-11-2026 23:10, Marius: 'maak het mooier en beter'): de volgorde begint met de etalage (de handgekozen toppen van de drukste pagina's,
     om en om), niet meer met het eerste cadeau van een klein vakje (Pistachecrème, Snoeischaar); vragen met icoontje en een kruisje om te wissen;
     een rij 'Snel kiezen' met ronde plaatjes; sorteren op prijs; een balk die meeloopt als je naar beneden scrolt. Kaarten en knop zoals op de echte site.
     Sieraden staan niet meer achteraan (Marius 16-11 23:12: 'sieraden hoeft niet meer achteraan, ik heb het uitgezocht'). -->
<style>

.kop a{text-decoration:none;font:700 20px/1 var(--k);color:var(--marine)}
.kop a span{color:var(--goud)}

h1{font:700 clamp(25px,6.6vw,36px)/1.12 var(--k);margin:2px 0 3px;color:var(--marine);text-wrap:balance}
.sub{color:var(--zacht);margin:0 0 12px;font-size:15px;line-height:1.4}

.zoek{position:relative;margin:0 0 10px}
.zoek input{width:100%;min-height:50px;border:1px solid var(--rand);border-radius:14px;background:var(--wit);padding:0 46px;font-size:16px;outline:none;box-shadow:0 2px 8px rgba(10,16,32,.04)}

/* de vier vragen: twee naast elkaar op de telefoon, vier op de computer */
.vragen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.vr{position:relative;min-width:0}
.vr-k{display:grid;grid-template-columns:34px minmax(0,1fr) 16px;align-items:center;gap:9px;width:100%;min-height:58px;text-align:left;border:1px solid var(--rand);border-radius:14px;background:var(--wit);padding:8px 10px 8px 9px;box-shadow:0 2px 8px rgba(10,16,32,.04)}
.vr-k .ic{width:34px;height:34px;border-radius:50%;background:var(--ivoor);box-shadow:inset 0 0 0 1px var(--rand);display:grid;place-items:center}
.vr-k .ic svg{width:18px;height:18px;stroke:var(--goud)}

.vr-k .pijl{width:16px;height:16px;stroke:var(--goud)}
.vr.aan .vr-k{background:var(--marine);border-color:var(--marine);padding-right:44px;grid-template-columns:34px minmax(0,1fr)}
.vr.aan .vr-k .ic{background:rgba(255,255,255,.1);box-shadow:none}
.vr.aan .vr-k .ic svg{stroke:var(--lgoud)}
.vr.aan .vr-k small{color:#C9CCD6}
.vr.aan .vr-k b{color:#fff}
.vr.aan .vr-k .pijl{display:none}
.vr-x{position:absolute;right:2px;top:50%;margin-top:-22px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
.vr-x span{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:17px;line-height:1}
@media (max-width:359px){.vr-k{grid-template-columns:minmax(0,1fr) 16px;padding-left:12px}.vr-k .ic{display:none}.vr.aan .vr-k{grid-template-columns:minmax(0,1fr)}}

.snel{margin:14px calc(-1 * max(16px,env(safe-area-inset-left))) 0;padding:0 max(16px,env(safe-area-inset-left));display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.snel::-webkit-scrollbar{display:none}
.sn{flex:0 0 auto;width:78px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:4px 2px 2px;scroll-snap-align:start}
.sn i{width:62px;height:62px;border-radius:50%;overflow:hidden;background:var(--marine)}
.sn i img{width:100%;height:100%;object-fit:cover}
.sn i.foto{background:var(--wit);box-shadow:inset 0 0 0 2px var(--goud)}
.sn i.foto img{object-fit:contain;padding:7px}
.sn span{font-size:12.5px;font-weight:700;line-height:1.2;color:var(--tekst);text-align:center;hyphens:manual}
.sn[aria-pressed="true"] i{outline:3px solid var(--marine);outline-offset:2px}
.sn[aria-pressed="true"] span{color:var(--marine);font-weight:800}
@media (min-width:760px){.snel{margin-left:0;margin-right:0;padding:0;justify-content:space-between;gap:0}.sn{width:72px}}

.wisalles{border:0;background:none;padding:0 4px;min-height:44px;font-weight:800;font-size:14.5px;color:var(--dgoud);text-decoration:underline;text-underline-offset:3px}
.links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sort{position:relative}
.sort select{appearance:none;-webkit-appearance:none;min-height:44px;border:1px solid var(--rand);border-radius:999px;background:var(--wit);padding:0 32px 0 14px;font-weight:700;font-size:14.5px;color:var(--marine)}
.sort svg{position:absolute;right:11px;top:50%;width:16px;height:16px;margin-top:-8px;stroke:var(--goud);pointer-events:none}

/* de cadeaus */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.kaart{display:flex;flex-direction:column;background:var(--wit);border:1px solid var(--rand);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(10,16,32,.06);min-width:0}
.kaart .f{display:block;aspect-ratio:1;max-width:100%;background:#fff;border:0;padding:0;width:100%}
.kaart .f img{width:100%;height:100%;object-fit:contain;padding:4%}
.kaart .in{display:flex;flex-direction:column;gap:6px;padding:4px 10px 10px;flex:1;border-top:1px solid #F1E9DA}
.kaart .t{font-weight:700;font-size:14.5px;line-height:1.3;color:var(--tekst);hyphens:manual;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left;background:none;border:0;padding:6px 0 0;min-height:calc(2 * 1.3em + 6px)}
.kaart .p{font-weight:800;font-size:17px;color:var(--marine);margin-top:auto;line-height:1.2}
.kaart .k{display:flex;align-items:center;justify-content:center;min-height:44px;padding:7px 10px;border-radius:999px;background:linear-gradient(180deg,#F2CB74 0%,#D9A848 100%);border:1px solid var(--goud);color:var(--tekst);text-decoration:none;font-weight:700;font-size:13.5px;line-height:1.2;text-align:center;text-wrap:balance;box-shadow:0 3px 10px rgba(184,134,46,.22)}

.pl.n{border:0;background:none;padding:0 6px 0 0;font-weight:700;color:var(--zacht);cursor:default}
.pl.n b{color:var(--marine)}

.dkop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--ivoor);border-bottom:1px solid var(--rand)}

.op i img{width:100%;height:100%;object-fit:cover}

.dvoet .toon{border:0;background:var(--marine);color:#fff}
.k-knop{background:var(--marine)!important}

    if (SNEL_KLAAR) { [].forEach.call(document.querySelectorAll('#snel .sn'), function (b) { var d = b.getAttribute('data-snel').split(':'); b.setAttribute('aria-pressed', String(d[0] === 'mom' ? S.mom === d[1] : heeft(S.soort, d[1]))); }); return; }
    SNEL_KLAAR = true;
    document.getElementById('snel').innerHTML = SNEL.map(function (x) {
      var aan, naam, beeld;
      if (x.t === 'mom') { aan = S.mom === x.id; naam = MOMP[x.id].naam; beeld = '<i><img src="' + R + MOMP[x.id].beeld + '-klein.webp" alt=""></i>'; }
      else { var s = SOORTP[x.id]; aan = heeft(S.soort, x.id); naam = s.naam; beeld = rondje(s).replace(' loading="lazy"', ''); }
      return '<button type="button" class="sn" data-snel="' + x.t + ':' + x.id + '" aria-pressed="' + aan + '">' + beeld + '<span>' + esc(naam) + '</span></button>';
    }).join('');
  }
  /* lange woorden netjes afbreken met de nagelezen tabel van de echte site (LK_AFBREEK) */
  var AFB = {}; (window.LK_AFBREEK || '').split('|').forEach(function (w) { if (w) AFB[w.replace(/-/g, '')] = w; });
  function zachtAf(t) { return String(t).replace(/[A-Za-zÀ-ÿ]{12,}/g, function (w) { var a = AFB[w.toLowerCase()]; if (!a) return w; var u = '', k = 0; for (var i = 0; i < a.length; i++) { if (a[i] === '-') u += '­'; else u += w[k++]; } return u; }); }
  function kaart(p) {
    return '<article class="kaart"><button class="f" type="button" data-blad="' + esc(p.id) + '" aria-label="Meer over ' + esc(p.titel) + '"><img src="' + K.klein(p) + '" alt="" loading="lazy"></button><div class="in"><button class="t" type="button" data-blad="' + esc(p.id) + '">' + esc(zachtAf(p.titel)) + '</button><span class="p">' + euro(p.prijs) + '</span><a class="k" href="' + K.winkelLink(p) + '" target="_blank" rel="sponsored nofollow noopener">Bekijk bij ' + esc(p.shop) + '</a></div></article>';
  }
  var LIJST = [];
  function teken() {
    LIJST = orden(ALLES.filter(function (p) { return past(p, S); }), S);
    vragen(); snel();
    document.getElementById('aantal').innerHTML = '<b>' + LIJST.length.toLocaleString('nl-NL') + '</b> ' + (LIJST.length === 1 ? 'cadeau' : 'cadeaus');
    document.getElementById('grid').innerHTML = LIJST.slice(0, S.n).map(kaart).join('');
    var n = Math.min(S.n, LIJST.length);
    document.getElementById('meer').innerHTML = !LIJST.length ? '<p class="leeg">Hier vonden we niets bij. Haal een keuze weg met het kruisje, of tik op Wis alles.</p>' : (LIJST.length > S.n ? '<p class="nog">Je ziet er ' + n + ' van ' + LIJST.length.toLocaleString('nl-NL') + '</p><button class="meer" type="button" data-meer>Laat er nog 24 zien</button>' : '');
    document.getElementById('qweg').hidden = !elQ.value;
  }
  /* aantallen per keuze: tel met alle andere keuzes aan */
  function tellen(vraag) {
    var t = {};
    ALLES.forEach(function (p) {
      if (!past(p, S, vraag)) return;
      if (vraag === 'wie') WIE.forEach(function (w) { if (wieOk(p, w.id) && smalOk(p, { wie: w.id, mom: S.mom })) t[w.id] = (t[w.id] || 0) + 1; });
      else if (vraag === 'bed') BED.forEach(function (b) { if (inBed(p, b)) t[b.id] = (t[b.id] || 0) + 1; });
      else if (vraag === 'mom') p._mo.forEach(function (id) { t[id] = (t[id] || 0) + 1; });
      else if (vraag === 'soort') { if (p._dr && !drankMag(S)) t.drank = (t.drank || 0) + 1; else p._so.forEach(function (id) { t[id] = (t[id] || 0) + 1; }); }
    });
    return t;
  }
  var BLAD = '', elBlad = document.getElementById('blad');
  function opent(vraag) {
    BLAD = vraag;
    document.getElementById('bkop').textContent = { wie: 'Voor wie?', bed: 'Hoeveel wil je uitgeven?', soort: 'Wat zoek je?', mom: 'Waarvoor?' }[vraag];
    document.getElementById('dzoek').hidden = vraag !== 'soort'; document.getElementById('dq').value = '';
    document.getElementById('dvoet').hidden = vraag !== 'soort';
    tekenOpties();
    elBlad.hidden = false; document.body.classList.add('vast');
    document.getElementById('opties').scrollTop = 0;
  }
  function tekenOpties() {
    var t = tellen(BLAD), dq = norm(document.getElementById('dq').value.trim()), html = '';
    function op(id, naam, beeld, n, aan) { return '<button type="button" class="op" data-kies="' + id + '" aria-pressed="' + aan + '">' + beeld + '<span><b>' + esc(naam) + '</b><small>' + (n || 0).toLocaleString('nl-NL') + ' cadeaus</small></span></button>'; }
    function plaatje(src) { return '<i><img src="' + src + '" alt="" loading="lazy"></i>'; }
    function tekst(s) { return '<i class="tk">' + s + '</i>'; }
    var alle = ALLES.filter(function (p) { return past(p, S, BLAD); }).length;
    if (BLAD === 'wie') html = op('', 'Iedereen', plaatje(R + 'col-originele-cadeaus-klein.webp'), alle, !S.wie) + WIE.filter(function (w) { return t[w.id]; }).map(function (w) { return op(w.id, w.naam, plaatje(R + w.beeld + '-klein.webp'), t[w.id], S.wie === w.id); }).join('');
    if (BLAD === 'bed') html = op('', 'Alle bedragen', tekst('€'), alle, !S.bed) + BED.filter(function (b) { return t[b.id]; }).map(function (b) { return op(b.id, b.naam, tekst(b.kort), t[b.id], S.bed === b.id); }).join('');
    if (BLAD === 'mom') html = op('', 'Maakt niet uit', plaatje(R + 'col-toppers-van-nu-klein.webp'), alle, !S.mom) + MOM.filter(function (m) { return t[m.id]; }).map(function (m) { return op(m.id, m.naam, plaatje(R + m.beeld + '-klein.webp'), t[m.id], S.mom === m.id); }).join('');
    if (BLAD === 'soort') {
      html = SOORT.filter(function (s) { return (t[s.id] || heeft(S.soort, s.id)) && (!dq || norm(s.naam).indexOf(dq) !== -1); }).map(function (s) { return op(s.id, s.naam, rondje(s), t[s.id], heeft(S.soort, s.id)); }).join('') || '<p class="leeg" style="grid-column:1/-1">Geen soort gevonden. Probeer het zoekvak bovenaan de pagina.</p>';
      var n = ALLES.filter(function (p) { return past(p, S); }).length;
      document.getElementById('toonknop').textContent = 'Toon ' + n.toLocaleString('nl-NL') + (n === 1 ? ' cadeau' : ' cadeaus');
    }
    document.getElementById('opties').innerHTML = html;
  }
  function dicht() { elBlad.hidden = true; document.body.classList.remove('vast'); BLAD = ''; S.n = 24; schrijf(); teken(); }
  function naarBoven() { var g = document.getElementById('grid'), y = g.getBoundingClientRect().top + window.scrollY - 120; if (window.scrollY > y) window.scrollTo(0, Math.max(0, y)); }

  document.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-vraag]'))) { opent(t.getAttribute('data-vraag')); return; }
    if ((t = e.target.closest('[data-kies]'))) {
      var id = t.getAttribute('data-kies');
      if (BLAD === 'soort') { var i = S.soort.indexOf(id); if (i === -1) S.soort.push(id); else S.soort.splice(i, 1); tekenOpties(); return; }
      S[BLAD] = id; dicht(); naarBoven(); return;
    }
    if (e.target.closest('[data-wis-soort]')) { S.soort = []; tekenOpties(); return; }
    if (e.target.closest('[data-dicht]') || e.target === elBlad) { dicht(); naarBoven(); return; }
    if ((t = e.target.closest('[data-snel]'))) {
      var d = t.getAttribute('data-snel').split(':');
      if (d[0] === 'mom') S.mom = S.mom === d[1] ? '' : d[1];
      else S.soort = (S.soort.length === 1 && S.soort[0] === d[1]) ? [] : [d[1]];
      S.n = 24; schrijf(); teken(); return;
    }
    if ((t = e.target.closest('[data-weg]'))) {
      var w = t.getAttribute('data-weg');
      if (w === 'soort') S.soort = []; else S[w] = '';
      S.n = 24; schrijf(); teken(); return;
    }
    if (e.target.closest('[data-alleswis]')) { S.wie = S.bed = S.mom = ''; S.soort = []; S.q = ''; elQ.value = ''; S.n = 24; schrijf(); teken(); return; }
    if (e.target.closest('#qweg')) { elQ.value = ''; S.q = ''; S.n = 24; schrijf(); teken(); elQ.focus(); return; }
    if (e.target.closest('[data-meer]')) { var oud = S.n; S.n += 24; teken(); var k = document.querySelectorAll('#grid .kaart')[oud]; if (k) k.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !elBlad.hidden) dicht(); });
  var wacht = 0;
  elQ.addEventListener('input', function () { clearTimeout(wacht); wacht = setTimeout(function () { S.q = norm(elQ.value.trim()); S.n = 24; schrijf(); teken(); }, 180); });
  elQ.addEventListener('keydown', function (e) { if (e.key === 'Enter') { elQ.blur(); } });
  elSort.addEventListener('change', function () { S.sort = elSort.value; S.n = 24; schrijf(); teken(); });
  document.getElementById('dq').addEventListener('input', tekenOpties);
  window.addEventListener('hashchange', function () { lees(); teken(); });
  /* de balk bovenaan verschijnt zodra de vier vragen uit beeld zijn */
  var elPlak = document.getElementById('plak');
  if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { es.forEach(function (x) { elPlak.hidden = x.isIntersecting || x.boundingClientRect.top > 0; }); }).observe(document.getElementById('vragen'));
  lees(); teken();
})();
</script>
</body>
