<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeukeKeuze</title>
<script>
/* Oude adressen van de vorige site doorsturen naar de nieuwe pagina's (dit deed eerst Netlify met _redirects). */
(function () {
  var p = location.pathname.replace(/\/+$/, '').toLowerCase();
  var kaart = { '/christelijke-cadeaus': '/#/c/christelijk', '/cadeaus-voor-kinderen': '/#/c/cadeaus/voor-kinderen', '/cadeauzoeker': '/#/vonk', '/cadeaugidsen': '/' };
  var doel = kaart[p] || (/^\/(cadeaugids|keurkamer)\//.test(p + '/') ? '/' : '/');
  location.replace(doel);
})();
</script>
