<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landschap-keurkamer LeukeKeuze</title>
<!-- LANDSCHAP-KEURKAMER (15-11-2026, Marius: 'dat van dat landschap is een super goed idee om spullen te selecteren en weg te doen').
     Alle cadeaus die nu op de site staan op één kaart. Elk eiland is een afdeling (of een winkel), elke wijk een groep.
     Klik op een cadeau = weg (rood kruis), nog een keer klikken = blijft. Shift + slepen = een vak trekken: alles wat erin ligt
     (en past bij het filter) gaat weg. Alt + Shift + slepen = terug. Ctrl+Z = ongedaan maken.
     Keuzes worden meteen bewaard in 'mijn keuzes\weg-landschap.json'. Gouden rand = 'zonde?' (staat in een met de hand gekozen top). -->
<style>
:root{--zee:#D3E7EE;--inkt:#13202B;--zacht:#5E6B76;--rood:#C81E1E;--goud:#C9952B;--paneel:#FFFDF8;--lijn:#E7E0D2;--f:'Segoe UI',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--zee);color:var(--inkt);font:500 14px/1.4 var(--f)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#kaart{position:fixed;left:0;top:0;width:calc(100vw - 360px);height:100vh;touch-action:none;display:block;cursor:grab}
#kaart.trek{cursor:crosshair}
.paneel{position:fixed;top:0;right:0;bottom:0;width:360px;background:var(--paneel);border-left:1px solid var(--lijn);display:flex;flex-direction:column;z-index:5}
.paneel .boven{padding:14px 16px 10px;border-bottom:1px solid var(--lijn)}
h1{margin:0 0 2px;font:800 19px/1.2 var(--f)}
h1 span{color:var(--rood)}
.uitleg{margin:0;color:var(--zacht);font-size:12.5px}
.uitleg b{color:var(--inkt)}
.blok{padding:10px 16px;border-bottom:1px solid var(--lijn);display:grid;gap:8px}
.blok label{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--zacht)}
.blok input[type=text],.blok input[type=number],.blok select{width:100%;padding:7px 9px;border:1px solid #D6CDBB;border-radius:8px;background:#fff;font-size:14px;font-weight:500;color:var(--inkt)}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wissel{display:flex;border:1px solid #D6CDBB;border-radius:9px;overflow:hidden}
.wissel button{flex:1;border:0;background:#fff;padding:7px 4px;font-weight:700;font-size:13px}
.wissel button[aria-pressed="true"]{background:var(--inkt);color:#fff}
.vink{display:flex!important;align-items:center;gap:7px;color:var(--inkt)!important;font-weight:600!important;font-size:13px!important}
.passen{font-size:12.5px;color:var(--zacht)}
.teller{padding:12px 16px 8px;display:flex;align-items:baseline;gap:8px}
.teller b{font:800 30px/1 var(--f);color:var(--rood)}
.teller span{font-weight:700}
.teller small{margin-left:auto;color:var(--zacht);font-size:12px}
.lijst{flex:1;overflow:auto;padding:0 10px 10px}
.lijst .it{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;cursor:pointer}
.lijst .it:hover{background:#F3EEE3}
.lijst img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:7px;border:1px solid var(--lijn);flex:none}
.lijst .t{flex:1;min-width:0;font-size:12.5px;line-height:1.25}
.lijst .t i{display:block;font-style:normal;color:var(--zacht);font-size:11.5px}
.lijst .x{border:0;background:none;font-size:18px;color:var(--zacht);width:30px;height:30px;border-radius:50%}
.lijst .x:hover{background:#EADFCB;color:var(--inkt)}
.leeg{color:var(--zacht);font-size:13px;padding:6px 8px}
.onder{padding:10px 16px 14px;border-top:1px solid var(--lijn);display:grid;grid-template-columns:auto 1fr;gap:8px}
.onder button{border-radius:10px;padding:10px 12px;font-weight:800;border:1px solid #D6CDBB;background:#fff}
.onder .klaar{background:var(--rood);border-color:var(--rood);color:#fff}
.status{grid-column:1/-1;font-size:12px;color:var(--zacht);text-align:center;min-height:16px}
.zoom{position:fixed;right:376px;bottom:16px;z-index:4;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,40,60,.2);font:800 20px/1 var(--f)}
.waar{position:fixed;left:16px;bottom:16px;z-index:4;background:rgba(19,32,43,.88);color:#fff;font-weight:700;padding:8px 14px;border-radius:999px;pointer-events:none;max-width:calc(100% - 460px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:fixed;z-index:8;pointer-events:none;width:250px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,30,50,.28);overflow:hidden;display:none}
.tip img{display:block;width:250px;height:200px;object-fit:contain;background:#fff;padding:8px}
.tip .in{padding:8px 12px 11px;border-top:1px solid #eee}
.tip b{display:block;font-size:13.5px;line-height:1.3}
.tip .r{display:flex;gap:8px;align-items:baseline;margin-top:4px;font-size:12.5px;color:var(--zacht)}
.tip .r strong{color:var(--inkt);font-size:15px}
.tip .lab{display:inline-block;margin-top:6px;margin-right:4px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.lab.zonde{background:#FBEFD5;color:#7A5410}.lab.weg{background:#FDE2E2;color:var(--rood)}.lab.korting{background:#DCFCE7;color:#166534}
.tip .doe{margin-top:6px;font-size:11.5px;color:var(--zacht)}
.laden{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--zee);font:700 17px/1.4 var(--f);text-align:center;padding:20px}
#rechthoek{position:fixed;z-index:6;border:2px dashed var(--rood);background:rgba(200,30,30,.10);pointer-events:none;display:none}
#rechthoek.terug{border-color:#15803D;background:rgba(21,128,61,.10)}
@media (max-width:820px){#kaart{width:100vw;height:54vh}.paneel{top:auto;height:46vh;width:100%;border-left:0;border-top:1px solid var(--lijn)}.zoom{right:12px;bottom:calc(46vh + 12px)}.waar{display:none}}
</style>
</head>
<body>
<canvas id="kaart"></canvas>
<div id="rechthoek"></div>
<aside class="paneel">
  <div class="boven">
    <h1>Landschap-<span>keurkamer</span></h1>
    <p class="uitleg"><b>Klik</b> op een cadeau: weg (nog een keer: blijft). <b>Shift + slepen</b>: alles in het vak weg. <b>Alt + Shift + slepen</b>: terug. <b>Ctrl+Z</b>: ongedaan. Gouden rand = <b>zonde?</b> (met de hand gekozen topper).</p>
  </div>
  <div class="blok">
    <div class="wissel" id="indeling"><button type="button" data-v="afd" aria-pressed="true">Eilanden per afdeling</button><button type="button" data-v="shop" aria-pressed="false">per winkel</button></div>
    <label>Winkel<select id="fShop"><option value="">Alle winkels</option></select></label>
    <label>Woord in de naam<input type="text" id="fZoek" placeholder="bijv. sokken, ketting, mok"></label>
    <div class="twee"><label>Prijs vanaf<input type="number" id="fMin" min="0" placeholder="€"></label><label>Prijs tot<input type="number" id="fMax" min="0" placeholder="€"></label></div>
    <label class="vink"><input type="checkbox" id="fZonde"> Toppers (gouden rand) niet meenemen bij slepen</label>
    <label class="vink"><input type="checkbox" id="fVerberg"> Wat al weg is lichter tonen</label>
    <label class="vink"><input type="checkbox" id="fZonderBol"> <b>Zonder bol</b>: laat zien wat er overblijft</label>
    <div class="passen" id="passen"></div>
  </div>
  <div class="teller"><b id="nWeg">0</b><span>weg gekozen</span><small id="nZonde"></small></div>
  <div class="lijst" id="lijst"></div>
  <div class="onder"><button type="button" id="terug" title="Ctrl+Z">↶ Ongedaan</button><button type="button" class="klaar" id="klaar">Klaar: bewaar voor Claude</button><div class="status" id="status"></div></div>
</aside>
<div class="zoom"><button type="button" id="plus">+</button><button type="button" id="min">−</button><button type="button" id="thuis" title="Hele kaart">⤢</button></div>
<div class="waar" id="waar"></div>
<div class="tip" id="tip"></div>
<div class="laden" id="laden">De producten van leukekeuze.nl ophalen…</div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search), BRON = (q.get('bron') || 'https://leukekeuze.nl').replace(/\/$/, '');
  var uur = Math.floor(Date.now() / 36e5);
  function laad(src) { return new Promise(function (ok, nee) { var s = document.createElement('script'); s.src = BRON + src + '?t=' + uur; s.onload = ok; s.onerror = function () { nee(new Error(src)); }; document.head.appendChild(s); }); }
  laad('/assets/js/data.js').then(function () { return laad('/assets/js/topkeuze.js'); }).then(function () { return laad('/assets/js/producten-lean.js'); })
    .then(function () { return fetch('/api/keuzes').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }); })
    .then(start).catch(function (e) { document.getElementById('laden').textContent = 'Kon de producten niet ophalen (' + e.message + '). Staat het internet aan?'; });

  function start(opgeslagen) {
  /* ---------- gegevens ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function euro(n) { var s = Number(n).toFixed(2).split('.'); return '€ ' + s[0] + ',' + s[1]; }
  function klein(p) { return BRON + '/' + p.beeld + '-klein.webp'; }
  function groot(p) { return BRON + '/' + p.beeld + '.webp'; }
  var ALLES = (window.LK_PRODUCTEN || []).filter(function (p) { return p.status === 'goedgekeurd' && p.beeld && p.afd; });
  var PER = {}; ALLES.forEach(function (p) { PER[p.id] = p; });
  var TOP = Object.assign({}, window.LK_TOPKEUZE || {}), VAST = window.LK_TOPVAST || {};
  Object.keys(VAST).forEach(function (k) { TOP[k] = VAST[k]; });
  var RANG = {}, ZONDE = {};
  Object.keys(TOP).forEach(function (k) { (TOP[k] || []).forEach(function (id, i) { var v = 1 - i / 80; if (v > (RANG[id] || 0)) RANG[id] = v; }); });
  /* 'zonde?' spaarzaam: de eerste 8 van elke vaste top (wat bezoekers als eerste zien) en de favorieten */
  Object.keys(VAST).forEach(function (k) { (VAST[k] || []).slice(0, 8).forEach(function (id) { ZONDE[id] = 1; }); });
  ALLES.forEach(function (p) { if (p.favoriet || p.populair) ZONDE[p.id] = 1; });
  var ANAAM = {}, GNAAM = {}, VNAAM = {};
  (window.LK_CATEGORIEEN || []).forEach(function (c) { ANAAM[c.slug] = c.naam; (c.subs || []).forEach(function (s) { GNAAM[c.slug + '/' + s.slug] = s.naam; (s.vakjes || []).forEach(function (v) { VNAAM[c.slug + '/' + s.slug + '/' + v.slug] = v.naam; }); }); });
  function mens(s) { s = String(s || '').replace(/-/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); }
  function plek(p) { return (ANAAM[p.afd] || mens(p.afd)) + ' › ' + (GNAAM[p.afd + '/' + p.groep] || mens(p.groep)) + (p.vak ? ' › ' + (VNAAM[p.afd + '/' + p.groep + '/' + p.vak] || mens(p.vak)) : ''); }
  function korting(p) { return p.van && p.van > p.prijs; }

  /* ---------- keuzes ---------- */
  var WEG = new Map(), KLAAR = false;
  ((opgeslagen && opgeslagen.weg) || []).forEach(function (x) { if (x && x.id) WEG.set(x.id, x); });
  var STAPPEN = [];
  function zetWeg(ids, aan) {
    var veranderd = [];
    ids.forEach(function (id) { var p = PER[id]; if (!p) return; if (aan && !WEG.has(id)) { WEG.set(id, { id: id, titel: p.titel, shop: p.shop, prijs: p.prijs, plek: plek(p), zonde: !!ZONDE[id], gekozen_op: new Date().toISOString() }); veranderd.push(id); } else if (!aan && WEG.has(id)) { WEG.delete(id); veranderd.push(id); } });
    if (veranderd.length) { STAPPEN.push({ ids: veranderd, aan: aan }); KLAAR = false; bewaarStraks(); lijst(); vuil(); }
    return veranderd.length;
  }
  function ongedaan() { var s = STAPPEN.pop(); if (!s) return; s.ids.forEach(function (id) { if (s.aan) WEG.delete(id); else { var p = PER[id]; if (p) WEG.set(id, { id: id, titel: p.titel, shop: p.shop, prijs: p.prijs, plek: plek(p), zonde: !!ZONDE[id], gekozen_op: new Date().toISOString() }); } }); bewaarStraks(); lijst(); vuil(); }
  var MELD = '', tBewaar = 0, statusEl = document.getElementById('status');
  function bewaarStraks() { clearTimeout(tBewaar); statusEl.textContent = 'Bewaren…'; tBewaar = setTimeout(bewaar, 700); }
  function bewaar() {
    var data = { bijgewerkt: new Date().toISOString(), klaar: KLAAR, aantal: WEG.size, weg: Array.from(WEG.values()) };
    return fetch('/api/bewaar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { if (!r.ok) throw 0; var d = new Date(); statusEl.textContent = MELD + (KLAAR ? 'Klaar en bewaard om ' : 'Bewaard om ') + d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) + (KLAAR ? '. Zeg tegen Claude: klaar landschap' : ''); MELD = ''; })
      .catch(function () { statusEl.textContent = 'Niet bewaard! Staat het zwarte venster van de keurkamer nog open?'; });
  }

  /* ---------- filters ---------- */
  var fShop = '', fZoek = '', fMin = 0, fMax = 0, fZonde = false, fVerberg = false;
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  var ZOEKT = {}; ALLES.forEach(function (p) { ZOEKT[p.id] = norm(p.titel + ' ' + (p.merk || '') + ' ' + p.shop); });
  function past(p) {
    if (fShop && p.shop !== fShop) return false;
    if (fMin && p.prijs < fMin) return false; if (fMax && p.prijs > fMax) return false;
    if (fZoek) { var t = ZOEKT[p.id], w = fZoek.split(/\s+/); for (var i = 0; i < w.length; i++) if (w[i] && t.indexOf(w[i]) < 0) return false; }
    return true;
  }
  var winkels = {}; ALLES.forEach(function (p) { winkels[p.shop] = (winkels[p.shop] || 0) + 1; });
  document.getElementById('fShop').innerHTML += Object.keys(winkels).sort(function (a, b) { return winkels[b] - winkels[a]; }).map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + ' (' + winkels[s] + ')</option>'; }).join('');

  /* ---------- de wereld: eilanden (afdeling of winkel) met wijken (groep of afdeling) ---------- */
  var GAP = 1.2, EIL_GAP = 7, eilanden = [], cellen = [], bakken = {}, BAK = 8, WW = 0, WH = 0, passend;
  var KLEUR = ['#F59E0B', '#EC4899', '#8B5CF6', '#10B981', '#3B82F6', '#EF4444', '#14B8A6', '#F97316', '#6366F1', '#84CC16', '#06B6D4', '#D946EF', '#22C55E', '#A855F7', '#0EA5E9', '#E11D48', '#65A30D', '#7C3AED'];
  function spiraal(n) { var s = Math.ceil(Math.sqrt(n)), c = (s - 1) / 2, l = []; for (var y = 0; y < s; y++) for (var x = 0; x < s; x++) l.push([x, y, (x - c) * (x - c) + (y - c) * (y - c) + x * .001]); l.sort(function (a, b) { return a[2] - b[2]; }); return { s: s, cel: l.slice(0, n) }; }
  var indeling = 'afd', zonderBol = false;
  try { if (localStorage.getItem('ls-zb2') === '1') zonderBol = true; } catch (e) {}
  function isBol(p) { return /^bol/i.test(p.shop || ''); }
  var NBOL = ALLES.filter(isBol).length;
  function bouw() {
    eilanden = []; cellen = [];
    var per = {};
    ALLES.forEach(function (p) {
      if (zonderBol && isBol(p)) return;
      var e = indeling === 'afd' ? p.afd : p.shop, w = indeling === 'afd' ? p.groep : p.afd;
      ((per[e] || (per[e] = {}))[w] || (per[e][w] = [])).push(p);
    });
    var lijstE = Object.keys(per).map(function (a) { var n = 0; for (var g in per[a]) n += per[a][g].length; return [a, n]; }).sort(function (x, y) { return y[1] - x[1]; });
    lijstE.forEach(function (af, ai) {
      var groepen = Object.keys(per[af[0]]).map(function (g) { var l = per[af[0]][g].sort(function (a, b) { return (RANG[b.id] || 0) - (RANG[a.id] || 0); }); return { slug: g, l: l, sp: spiraal(l.length) }; }).sort(function (a, b) { return b.l.length - a.l.length; });
      var opp = 0; groepen.forEach(function (g) { opp += (g.sp.s + GAP) * (g.sp.s + GAP); });
      var breed = Math.max(groepen[0].sp.s + GAP, Math.ceil(Math.sqrt(opp) * 1.15)), x = 0, y = 0, rijH = 0, maxX = 0;
      groepen.forEach(function (g) { var s = g.sp.s; if (x > 0 && x + s > breed) { x = 0; y += rijH + GAP; rijH = 0; } g.x = x; g.y = y; x += s + GAP; if (s > rijH) rijH = s; if (x > maxX) maxX = x; });
      var naam = indeling === 'afd' ? (ANAAM[af[0]] || mens(af[0])) : af[0];
      eilanden.push({ slug: af[0], naam: naam, n: af[1], kleur: KLEUR[ai % KLEUR.length], groepen: groepen, w: maxX - GAP, h: y + rijH });
    });
    var totaal = 0; eilanden.forEach(function (e) { totaal += (e.w + EIL_GAP) * (e.h + EIL_GAP + 4); });
    var ASP = Math.max(.6, Math.min(2.4, cv.clientWidth / Math.max(300, cv.clientHeight))), WB = Math.sqrt(totaal * ASP) * 1.05, ex = 0, ey = 0, rh = 0; WW = 0; WH = 0;
    eilanden.forEach(function (e) { if (ex > 0 && ex + e.w > WB) { ex = 0; ey += rh + EIL_GAP + 4; rh = 0; } e.x = ex; e.y = ey + 4; ex += e.w + EIL_GAP; if (e.h + 4 > rh) rh = e.h + 4; WW = Math.max(WW, ex); WH = Math.max(WH, e.y + e.h); });
    eilanden.forEach(function (e) { e.groepen.forEach(function (g) { g.ax = e.x + g.x; g.ay = e.y + g.y; g.naam = indeling === 'afd' ? (GNAAM[e.slug + '/' + g.slug] || mens(g.slug)) : (ANAAM[g.slug] || mens(g.slug)); g.l.forEach(function (p, i) { var c = g.sp.cel[i]; cellen.push({ p: p, x: g.ax + c[0], y: g.ay + c[1], e: e, g: g }); }); }); });
    bakken = {}; cellen.forEach(function (c, i) { var k = Math.floor(c.x / BAK) + ',' + Math.floor(c.y / BAK); (bakken[k] || (bakken[k] = [])).push(i); });
    filter();
  }
  function filter() {
    passend = new Uint8Array(cellen.length); var n = 0;
    cellen.forEach(function (c, i) { passend[i] = past(c.p) ? 1 : 0; n += passend[i]; });
    var f = fShop || fZoek || fMin || fMax;
    document.getElementById('passen').textContent = f ? n.toLocaleString('nl-NL') + ' van de ' + cellen.length.toLocaleString('nl-NL') + ' cadeaus passen bij je filter (de rest is vaag)' : cellen.length.toLocaleString('nl-NL') + ' cadeaus op de kaart' + (zonderBol ? ' (zonder de ' + NBOL.toLocaleString('nl-NL') + ' van bol)' : '');
    vuil();
  }

  /* ---------- camera ---------- */
  var cv = document.getElementById('kaart'), ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1), VW, VH;
  var cam = { x: 0, y: 0, z: 1 }, ZMIN = .1, ZMAX = 200;
  if (q.get('test')) window.__ls = { cam: cam, weg: function () { return WEG.size; } };
  function maat() { VW = cv.clientWidth; VH = cv.clientHeight; cv.width = VW * dpr; cv.height = VH * dpr; vuil(); }
  function heel() { var z = Math.min((VW - 30) / WW, (VH - 60) / (WH + 4)); ZMIN = z * .7; return { x: WW / 2 - VW / 2 / z, y: (WH - 4) / 2 - VH / 2 / z, z: z }; }
  function naarScherm(wx, wy) { return [(wx - cam.x) * cam.z, (wy - cam.y) * cam.z]; }
  function naarWereld(sx, sy) { return [sx / cam.z + cam.x, sy / cam.z + cam.y]; }
  function zoomOm(sx, sy, f) { var w = naarWereld(sx, sy), nz = Math.max(ZMIN, Math.min(ZMAX, cam.z * f)); cam.z = nz; cam.x = w[0] - sx / nz; cam.y = w[1] - sy / nz; vuil(); }
  var vlucht = null;
  function vlieg(doel, ms) { var van = { x: cam.x, y: cam.y, z: cam.z }, t0 = performance.now(); ms = ms || 650;
    vlucht = function (t) { var k = Math.min(1, (t - t0) / ms), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, z = Math.exp(Math.log(van.z) + (Math.log(doel.z) - Math.log(van.z)) * e);
      var cx0 = van.x + VW / 2 / van.z, cy0 = van.y + VH / 2 / van.z, cx1 = doel.x + VW / 2 / doel.z, cy1 = doel.y + VH / 2 / doel.z;
