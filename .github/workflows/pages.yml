# Eigen upload naar GitHub Pages (7-11-2026).
# De standaard-upload van GitHub brak af na 10 minuten als GitHub traag was met "bestanden verwerken"
# (5 keer in 2 dagen). Deze upload mag 30 minuten wachten.
# Werkt pas nadat in GitHub bij Settings > Pages > Source "GitHub Actions" is gekozen.
name: Website uploaden

on:
  push:
    branches: [main]
  # De pins-upload (pins.yml) pusht met de GitHub-sleutel; zo'n push start geen andere uploads.
  # Daarom: na de pins-upload ook de website uploaden, zodat nieuwe pins live komen.
  workflow_run:
    workflows: ["Pinterest-pins vrijgeven"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit een lopende upload afbreken; nieuwe uploads wachten netjes op hun beurt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  uploaden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.upload.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Website-map klaarzetten (zonder bouwgereedschap)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' --exclude 'assets/js/producten.js' --exclude 'images/nova-origineel' --exclude 'WERKWIJZE.txt' --exclude 'CLAUDE.md' --exclude 'FABLE-OPDRACHT.md' --exclude 'PILOOT-LOGBOEK.md' --exclude 'keurkamer/nazorg' --exclude 'keurkamer/data' --exclude 'keurkamer/ai' --exclude 'keurkamer/ai-oordelen.json' --exclude 'README.md' ./ _site/
          # 7-11-2026: bronbestanden die de site zelf niet gebruikt gaan niet mee (GitHub Pages mag max. 1 GB zijn).
          # 9-11-2026: ook de interne keurkamer-gegevens (ca. 50 MB) niet; de site en de Keurkamer-app gebruiken die niet.
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 9-11-2026: GitHub blijft soms hangen op "bestanden verwerken" en breekt dan na 10 minuten af (de upload zelf duurt normaal 1 minuut).
      # Dan nog twee keer opnieuw proberen met dezelfde, al klaargezette website.
      - id: upload
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
      - id: upload2
        if: steps.upload.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
      - id: upload3
        if: steps.upload.outcome == 'failure' && steps.upload2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
